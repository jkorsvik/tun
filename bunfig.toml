# bun config — bun only, never npm.
#
# There is NO JavaScript dependency in this repo today, and that is deliberate: the
# dashboard template is hand-rolled SVG with no framework, no bundler and no
# node_modules, so a dashboard stays a single portable file with nothing to install.
#
# This file exists so that IF anyone ever reaches for a JS tool, it is bun, and so nobody
# reaches for npm. The registry is bun's default (the public npm registry). An
# organisation with an internal mirror sets it locally, not here; see the note in
# pyproject.toml about proving a mirror from every environment that must use it.
