  var ul = el('ul', { id: key });
  section.appendChild(ul);
  var wrap = el('div', { style: 'margin-top:.5rem' });
  wrap.appendChild(addButton(key, addLabel));
  section.appendChild(wrap);
}

function buildPanes() {
  var host = document.getElementById('panes');
  host.innerHTML = '';
  (state.panes || []).forEach(function (pane) {
    var section = el('section', { class: 'pane', id: 'pane-' + pane.id, role: 'tabpanel' });
    host.appendChild(section);
    if (pane.type === 'naa') buildNowPane(section, pane);
    else if (pane.type === 'rullering') buildRosterPane(section, pane);
    else if (pane.type === 'posts') buildPostsPane(section, pane);
    else if (pane.type === 'folk') buildPeoplePane(section, pane);
    else if (pane.type === 'beskjed') buildOrdersPane(section, pane);
    else if (pane.type === 'instruks') buildRulesPane(section, pane);
    else if (pane.type === 'sjekk') buildChecksPane(section, pane);
    else buildTextPane(section, pane);
  });
}

function buildNowPane(section, pane) {
  section.appendChild(el('div', { id: 'now' }));
}

function buildRosterPane(section, pane) {
  paneHeader(section, pane, 'Dager og vakter. \u00abEndre\u00bb \u00e5pner manuell redigering. Ingen automatisk omfordeling.');

  var bar = el('div', { style: 'margin-top:.75rem;display:flex;gap:.5rem;flex-wrap:wrap;align-items:center' });

  bar.appendChild(el('button', { class: 'tiny', id: 'sort-watch', type: 'button' }, 'Sorter p\u00e5 tid'));
  bar.appendChild(el('button', { class: 'tiny', id: 'add-day', type: 'button' }, '+ dag'));
  section.appendChild(bar);
  var details = el('details');
  details.appendChild(el('summary', null, 'Klargj\u00f8ring'));
  details.appendChild(el('ul', { id: 'klargjoring' }));
  var klWrap = el('div', { style: 'margin-top:.5rem' });
  klWrap.appendChild(addButton('klargjoring'));

  section.appendChild(details);
}

function buildPostsPane(section, pane) {

function buildPeoplePane(section, pane) {

/* ---------------- the roster ----------------
   Driven by `dayDates()`, not by a pass over the watches. That is what makes an
   empty day visible instead of absent. */

function renderRoster() {
  var host = document.getElementById('watches');
  if (!host) return;
  host.innerHTML = '';
  var table = el('table');
  var head = el('tr');
  ['#', 'Tid', 'P\u00e5 vakt'].forEach(function (label) { head.appendChild(el('th', null, label)); });
  head.appendChild(el('th', null, 'Endre'));
  var thead = el('thead'); thead.appendChild(head); table.appendChild(thead);
  var body = el('tbody'); table.appendChild(body);

  var index = 0;
  dayDates().forEach(function (day) {
    var heading = el('tr', { class: 'rday' });
    heading.appendChild(el('td', { colspan: '4' }, dayLabel(day)));
    body.appendChild(heading);

    var rows = state.watches.filter(function (watch) { return (watch.start || '').slice(0, 10) === day; })
      .sort(function (a, b) { return String(a.start).localeCompare(String(b.start)); });

    if (!rows.length) {
      var empty = el('tr', { class: 'empty-day' });
      empty.appendChild(el('td', { colspan: '4' }, 'Ingen vakter p\u00e5 denne dagen enn\u00e5. Bruk \u00ab+ vakt\u00bb og sett datoen.'));
      body.appendChild(empty);
      return;
    }

    rows.forEach(function (watch) {
      index += 1;
      var gone = superseded(watch);
      var tr = el('tr', { 'data-watch': watch.id });
      if (gone) tr.className = 'superseded';
      tr.appendChild(el('td', null, String(index)));
      tr.appendChild(el('td', { class: 'watch-time' }, pretty(watch.start) + '\u2013' + pretty(effectiveEnd(watch))));
      var names = el('td', { class: 'watch-names' }, (watch.crew || []).map(nameOf).join(', '));
      if (gone) names.appendChild(el('span', { class: 'gone-tag' }, ' erstattet av ' + (state.handover.replacedBy || 'neste plan')));
      tr.appendChild(names);

      var controls = el('details');
      controls.appendChild(el('summary', null, 'Endre'));
      ['start', 'end'].forEach(function (key) {
        var field = input(watch[key], '', null, 'datetime-local');
        field.className = 'time';
        field.setAttribute('aria-label', (key === 'start' ? 'Fra' : 'Til') + ' vakt ' + index);
        field.addEventListener('change', function () { watch[key] = field.value; persist(); renderRoster(); });
        controls.appendChild(field);
      });
      for (var slot = 0; slot < 3; slot++) (function (position) {
        var select = el('select', { 'aria-label': 'Rolle ' + (position + 1) + ' vakt ' + index });
        select.appendChild(el('option', { value: '' }, 'Ikke satt'));
        state.people.forEach(function (person) { select.appendChild(el('option', { value: person.id }, person.name)); });
        select.value = (watch.crew || [])[position] || '';
        select.addEventListener('change', function () { watch.crew[position] = select.value; persist(); renderRoster(); });
        controls.appendChild(select);
      })(slot);
      var cell = el('td'); cell.appendChild(controls); tr.appendChild(cell);
      body.appendChild(tr);
    });
  });

  var scroll = el('div', { class: 'scroller' }); scroll.appendChild(table); host.appendChild(scroll);

  if (rotationCut()) {
    var box = el('div', { class: 'box warn' });
    var cutIso = rotationCut();
    var cutText = cutIso.slice(8, 10) + '.' + cutIso.slice(5, 7) + ' kl. ' + pretty(cutIso);
    box.appendChild(el('strong', null, 'Planen skifter ' + cutText + '. ' + (state.handover.replacedBy || 'Neste plan') + ' tar over.'));
    if (state.handover.changed) box.appendChild(el('p', null, 'Endret: ' + state.handover.changed));
    if (state.handover.unchanged) box.appendChild(el('p', null, 'Uendret: ' + state.handover.unchanged));
    host.appendChild(box);
  }
  renderChecks();
}

  var keys = ['beskjed-bakgrunn', 'beskjed-oppgave', 'beskjed-bemanning', 'utstyr', 'orden', 'klargjoring',
    'plan', 'forhold', 'spesielt', 'kontakter', 'kommunikasjon', 'open'];
  (state.panes || []).forEach(function (pane) { if (pane.type === 'tekst') keys.push('list-' + pane.id); });
  keys.forEach(function (key) {
    var items = state.lists[key];
    if (!items) return;
    renderList(key, items, function (index) {
      items.splice(index, 1);
      persist();
      renderLists();
    });
  });
}

/* ---------------- checks ----------------
   Every warning names the record it is about. A check that says "something may
   be wrong" is worse than no check. */

function renderChecks() {
  var host = document.getElementById('checks');
  if (!host) return;
  var problems = [], warnings = [], notes = [];

  state.watches.forEach(function (watch, i) {
    var start = minutesOf(watch.start), end = minutesOf(watch.end);
    if (start === null || end === null) { problems.push('Vakt ' + (i + 1) + ': tid mangler eller er ugyldig.'); return; }
    if (end <= start) { problems.push('Vakt ' + (i + 1) + ': slutt er f\u00f8r start.'); return; }
    if (end - start !== 240) warnings.push('Vakt ' + (i + 1) + ' er ' + ((end - start) / 60) + ' timer, ikke fire.');
    var crew = (watch.crew || []).filter(Boolean);
    if (crew.length !== 3) warnings.push('Vakt ' + (i + 1) + ': ' + crew.length + ' roller satt, tre forventet.');
    if (superseded(watch) && crew.length) {
      warnings.push('Vakt ' + (i + 1) + ' (' + pretty(watch.start) + ') er erstattet av ' + (state.handover.replacedBy || 'neste plan') + '. Rollene er beholdt, men vakten gjelder ikke som vakt.');
    }
  });

  var seen = {};
  state.people.forEach(function (person) { if (seen[person.name]) problems.push('To roller heter \u00ab' + person.name + '\u00bb.'); seen[person.name] = true; });

  (state.handover.undecided || []).forEach(function (text) { notes.push(text); });

  lastChecks = { problems: problems, warnings: warnings };

  host.innerHTML = '';
  var summary = el('div', { class: problems.length ? 'box alert' : 'box' });
  summary.appendChild(el('strong', null, problems.length + ' feil \u00b7 ' + warnings.length + ' advarsler'));
  host.appendChild(summary);
  if (problems.length) {
    var ul = el('ul');
    problems.forEach(function (text) { ul.appendChild(el('li', null, text)); });
    host.appendChild(ul);
  }
  if (warnings.length) {
    var ul2 = el('ul');
    warnings.forEach(function (text) { ul2.appendChild(el('li', null, text)); });
    host.appendChild(ul2);
  }
  if (!problems.length && !warnings.length) host.appendChild(el('p', { class: 'sub' }, 'Ingen funn.'));
}

/* ---------------- now ---------------- */

function renderNow() {
  var host = document.getElementById('now');
  if (!host) return;
  host.innerHTML = '';
  var now = osloNow(), current = null, next = null;
  state.watches.forEach(function (watch) {
    if (superseded(watch)) return;
    var start = minutesOf(watch.start), end = minutesOf(effectiveEnd(watch));
    if (start === null || end === null) return;
    var nowMinutes = minutesOf(now);
    if (nowMinutes === null) return;
    if (nowMinutes >= start && nowMinutes < end) current = watch;
    if (start > nowMinutes && (!next || start < minutesOf(next.start))) next = watch;
  });
  var grid = el('div', { class: 'big' });
  [['N\u00e5', current], ['Neste', next]].forEach(function (pair, position) {
    var card = el('div', { class: 'card' + (position === 0 ? ' dark' : '') });
    card.appendChild(el('p', { class: 'card-label' }, pair[0]));
    card.appendChild(el('div', { class: 'v' }, pair[1] ? pretty(pair[1].start) + '\u2013' + pretty(effectiveEnd(pair[1])) : 'Ingen vakt i listen'));
    card.appendChild(el('p', null, pair[1] ? (pair[1].crew || []).map(nameOf).join(', ') : 'Ingen vakt akkurat n\u00e5.'));
    grid.appendChild(card);
  });
  host.appendChild(grid);
  host.appendChild(el('p', { class: 'sub' }, 'Klokken er ' + pretty(now) + ' Europe/Oslo. Vakter som er erstattet telles ikke.'));
}

/* ---------------- badges ---------------- */

function renderBadges() {
  function set(id, text, alert) {
    var node = document.getElementById(id);
    if (!node) return;
    node.textContent = text || '';
    node.className = alert ? 'alert' : '';
  }
  var index = 0;
  var nowMinutes = minutesOf(osloNow());
  state.watches.forEach(function (watch, i) {
    if (superseded(watch)) return;
    var from = minutesOf(watch.start), to = minutesOf(effectiveEnd(watch));
    if (from !== null && to !== null && nowMinutes !== null && nowMinutes >= from && nowMinutes < to) index = i + 1;
  });
  set('t-naa', index ? 'vakt ' + index : '');
  set('t-rullering', String(state.watches.length));
  set('t-folk', String(state.people.length));
  var filled = ((state.beskjed && state.beskjed.posts) || []).reduce(function (sum, post) { return sum + (post.people || []).filter(Boolean).length; }, 0);
  set('t-posts', String(filled));
  var problems = (lastChecks.problems || []).length;
  set('t-sjekk', String(problems + (lastChecks.warnings || []).length), problems > 0);
}

/* ---------------- pane switching ---------------- */

function showPane(name, scroll) {
  var panes = document.querySelectorAll('.pane');
  for (var i = 0; i < panes.length; i++) panes[i].classList.toggle('active', panes[i].id === 'pane-' + name);
  var tabs = document.querySelectorAll('.tab');
  for (var j = 0; j < tabs.length; j++) tabs[j].setAttribute('aria-selected', tabs[j].dataset.pane === name ? 'true' : 'false');
  currentPane = name;
  renderChecks();
  if (scroll) window.scrollTo(0, 0);
}

/* ---------------- persistence ----------------
   The file is the artefact and the only source of truth on load: boot() reads the state
   embedded in the copy it was opened from, and nothing else. There is no browser store,
   so two copies of a plan cannot silently disagree. Downloading writes the current state
   into a copy of this document; the saved file reopens with everything. */

/* There is no browser store. The file is the plan: a save writes a new file, and a page
   loads the payload embedded in the copy it was opened from. A localStorage copy would
   outrank the file on the next load and let two "current" plans disagree, which is the one
   thing a service book must not do. So persist() only marks the page dirty. */
function persist() { markSaved('Ulagret endring'); }

/* The saved state lives in a script element whose id this file must find again.
   The marker is assembled from parts on purpose: a literal occurrence of the tag in
   the source counts against the tenant's preview scanner and can switch scripting
   off for the whole page (docs/01-tenant-constraints.md row 25). */
function payloadPattern() {
  var tag = 'scr' + 'ipt';
  /* Three groups so the replacer in download() gets (open, body, close), matching
     the three-argument callback it was written with. */
  return new RegExp('(<' + tag + ' id="appstate" type="application\\/json">)([\\s\\S]*?)(<\\/' + tag + '>)');
}

function markSaved(text) { var node = document.getElementById('status'); if (node) node.textContent = text; }

/* ---------------- layout editor ----------------
   Panes are records. These four functions are the whole editor. */

function paneAdd() {
  var title = prompt('Navn p\u00e5 den nye fanen:', '');
  if (title === null) return;
  var type = (prompt('Type: ' + PANE_TYPES.join(', '), 'tekst') || 'tekst').trim();
  if (PANE_TYPES.indexOf(type) < 0) type = 'tekst';
  var id = 'x' + Date.now().toString(36);
  state.panes.push({ id: id, title: title || 'Ny fane', type: type });
  if (type === 'tekst') state.lists['list-' + id] = [''];
  persist(); buildTabs(); buildPanes(); wire(); render(); showPane(id, true);
}

function paneMove(id, delta) {
  var ids = state.panes.map(function (p) { return p.id; });
  var index = ids.indexOf(id), target = index + delta;
  if (index < 0 || target < 0 || target >= state.panes.length) return;
  var moved = state.panes.splice(index, 1)[0];
  state.panes.splice(target, 0, moved);
  persist(); buildTabs(); buildPanes(); wire(); render(); showPane(id, false);
}

function paneRemove(id) {
  if (id === 'naa' || id === 'rullering') { alert('Denne fanen kan ikke fjernes.'); return; }
  if (!confirm('Fjerne fanen \u00ab' + ((paneById(id) || {}).title || id) + '\u00bb?')) return;
  state.panes = state.panes.filter(function (p) { return p.id !== id; });
  delete state.lists['list-' + id];
  persist(); buildTabs(); buildPanes(); wire(); render(); showPane('naa', false);
}

function renderPanes() {
  var host = document.getElementById('pane-editor');
  if (!host) return;
  host.innerHTML = '';
  state.panes.forEach(function (pane) {
    var row = el('div', { class: 'pane-row' });
    var field = input(pane.title || '', 'fanenavn', function (value) {
      pane.title = value; persist();
      /* buildTabs() replaces the tab buttons, so their click handlers must be
         re-attached afterwards. Rebuilding without wire() leaves every tab dead. */
      buildTabs(); wire();
    });
    field.className = 'plain';
    field.setAttribute('aria-label', 'Navn på fanen ' + (pane.title || pane.id));
    row.appendChild(field);
    row.appendChild(el('span', { class: 'sub' }, pane.type));
    var up = el('button', { class: 'tiny', type: 'button', title: 'Flytt venstre' }, '\u2190');
    up.addEventListener('click', function () { paneMove(pane.id, -1); });
    var down = el('button', { class: 'tiny', type: 'button', title: 'Flytt h\u00f8yre' }, '\u2192');
    down.addEventListener('click', function () { paneMove(pane.id, 1); });
    var del = el('button', { class: 'tiny', type: 'button' }, 'Fjern');
    del.addEventListener('click', function () { paneRemove(pane.id); });
    row.appendChild(up); row.appendChild(down); row.appendChild(del);
    host.appendChild(row);
  });
}

function renderDays() {
  var host = document.getElementById('day-editor');
  if (!host) return;
  host.innerHTML = '';
  dayDates().forEach(function (date) {
    var record = dayRecord(date);
    var row = el('div', { class: 'pane-row' });
    row.appendChild(el('span', { class: 'sub' }, date));
    var label = input(record ? record.label : dayLabel(date), 'dagsnavn', function (value) {
      var target = dayRecord(date);
      if (!target) { target = { date: date, label: '', note: '' }; state.days.push(target); }
      target.label = value; persist(); renderRoster();
    });
    label.className = 'plain';
    label.setAttribute('aria-label', 'Navn på dagen ' + date);
    var note = input(record ? record.note : '', 'merknad', function (value) {
      var target = dayRecord(date);
      if (!target) { target = { date: date, label: dayLabel(date).split(' \u00b7 ')[0], note: '' }; state.days.push(target); }
      target.note = value; persist(); renderRoster();
    });
    note.className = 'plain';
    note.setAttribute('aria-label', 'Merknad for dagen ' + date);
    row.appendChild(label); row.appendChild(note);
    host.appendChild(row);
  });
}

/* ---------------- actions ---------------- */

function addWatch() {
  var last = state.watches.slice().sort(function (a, b) { return String(a.start).localeCompare(String(b.start)); }).slice(-1)[0];
  var startMinutes = last ? minutesOf(last.end) : minutesOf('2027-03-08T00:00');
  if (startMinutes === null) startMinutes = minutesOf('2027-03-08T00:00');
  state.watches.push({ id: 'w' + Date.now().toString(36), start: isoOf(startMinutes), end: isoOf(startMinutes + 240), crew: ['', '', ''], note: '' });
  persist(); renderRoster(); renderBadges();
}

function sortWatches() {
  state.watches.sort(function (a, b) { return String(a.start).localeCompare(String(b.start)); });
  persist(); renderRoster();
}

function addDay() {
  var dates = dayDates();
  var last = dates.slice(-1)[0] || '2027-03-08';
  var stamp = new Date(last + 'T12:00:00Z');
  stamp.setUTCDate(stamp.getUTCDate() + 1);
  var next = stamp.toISOString().slice(0, 10);
  var label = prompt('Navn p\u00e5 den nye dagen:', '');
  if (label === null) return;
  state.days.push({ date: next, label: label || dayLabel(next), note: '' });
  persist(); renderRoster(); renderDays();
}

function addPerson() {
  state.people.push({ id: 'p' + Date.now().toString(36), name: '', lag: '', note: '', reserve: false });
  persist(); renderPeople(); renderBadges();
}

function download() {
  var text = JSON.stringify(state).replace(/</g, '\\u003c');
  var shell = document.documentElement.outerHTML;
  var html = '<!DOCTYPE html>\n' + shell.replace(payloadPattern(), function (all, open, body, close) {
    return open + text + close;
  });
  var blob = new Blob([html], { type: 'text/html;charset=utf-8' });
  var url = URL.createObjectURL(blob);
  var link = document.createElement('a');
  link.href = url;
  link.download = 'servicebok-' + new Date().toISOString().slice(0, 10) + '.html';
  document.body.appendChild(link);
  link.click();
  link.remove();
  setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
  markSaved('Lagret som fil');
}

function importFile(file) {
  var reader = new FileReader();
  reader.onload = function () {
    var text = String(reader.result || '');
    var match = text.match(payloadPattern());
    if (!match) { alert('Fant ingen lagret tilstand i fila.'); return; }
    try {
      state = normalize(JSON.parse(match[2]));
      persist(); buildTabs(); buildPanes(); wire(); render(); showPane('naa', false);
      markSaved('Apnet fil');
    } catch (error) {
      alert('Kunne ikke lese fila: ' + error.message);
    }
  };
  reader.readAsText(file);
}

function resetAll() {
  if (!confirm('Nullstille til den innebygde planen? Endringer i denne visningen blir borte.')) return;
  state = normalize(JSON.parse(document.getElementById('appstate').textContent));
  persist(); buildTabs(); buildPanes(); wire(); render(); showPane('naa', false);
}

/* ---------------- normalize ----------------
   A file saved by an older version may lack panes or days. Migrate rather than
   refuse, and fill the lists each pane type needs. */

function normalize(data) {
  if (!data || typeof data !== 'object') throw new Error('Tom fil');
  if (!Array.isArray(data.people) || !Array.isArray(data.watches) || !data.lists) throw new Error('Ufullstendig fil');
  if (!Array.isArray(data.panes) || !data.panes.length) {
    data.panes = [
      { id: 'naa', title: 'N\u00e5', type: 'naa', badge: true },
      { id: 'rullering', title: 'Rullering', heading: 'Gjeldende vaktliste', type: 'rullering', badge: true }
    ];
  }
  data.panes.forEach(function (pane) {
    if (!pane.id) pane.id = 'x' + Math.random().toString(36).slice(2, 9);
    if (PANE_TYPES.indexOf(pane.type) < 0) pane.type = 'tekst';
    if (!pane.title) pane.title = pane.id;
    if (pane.type === 'tekst' && !data.lists['list-' + pane.id]) data.lists['list-' + pane.id] = [''];
  });
  if (!Array.isArray(data.days)) data.days = [];
  data.handover = data.handover || {};
  data.beskjed = data.beskjed || { posts: [] };
  if (!Array.isArray(data.beskjed.posts)) data.beskjed.posts = [];
  data.watches.forEach(function (watch) { if (!Array.isArray(watch.crew)) watch.crew = ['', '', '']; });
  return data;
}

function syncText() {
  var title = document.getElementById('title');
  var subtitle = document.getElementById('subtitle');
  var footer = document.getElementById('footer');
  if (title) title.textContent = state.title || '';
  if (subtitle) subtitle.textContent = state.subtitle || '';
  if (footer) footer.textContent = state.footer || '';
}

function render() {
  syncText();
  renderPeople();
  renderPosts();
  renderRoster();
  renderLists();
  renderHandover();
  renderChecks();
  renderPanes();
  renderDays();
  renderNow();
  renderBadges();
}

/* ---------------- wiring ----------------
   The pane builder recreates the DOM on every structural change, so handlers are
   attached in one function that runs after every rebuild. A button that binds its
   own handler at creation (the list buttons) does not need to be here; a button
   that is looked up by id does. */

function wire() {
  var nav = document.getElementById('tabs');
  var tabs = nav ? nav.querySelectorAll('.tab') : [];
  for (var i = 0; i < tabs.length; i++) {
    tabs[i].addEventListener('click', function () { showPane(this.dataset.pane, true); });
  }
  function on(id, handler) { var node = document.getElementById(id); if (node) node.addEventListener('click', handler); }
  on('add-watch', addWatch);
  on('sort-watch', sortWatches);
  on('add-day', addDay);
  on('add-person', addPerson);
  on('add-pane', paneAdd);
  on('open-layout', function () {
    var panel = document.getElementById('layout-tools');
    if (!panel) return;
    panel.open = true;
    renderPanes(); renderDays();
    panel.scrollIntoView({ behavior: 'smooth', block: 'start' });
  });
}

/* A file that will not load says so, in the page, and stops. Anything else is a page
   that looks like a plan and is not one. */
function showLoadError(message) {
  var host = document.getElementById('panes');
  var nav = document.getElementById('tabs');
  if (nav) nav.innerHTML = '';
  if (!host) return;
  host.innerHTML = '';
  var box = el('div', { class: 'pane active', id: 'pane-error' });
  box.appendChild(el('h2', null, 'Filen kunne ikke leses'));
  box.appendChild(el('p', { class: 'box alert' }, 'Denne filen har en lagret tilstand som ikke kan leses: ' + message));
  box.appendChild(el('p', { class: 'sub' }, 'Filen er skadet eller laget av en annen versjon. Apne den opprinnelige filen, eller bygg den pa nytt.'));
  host.appendChild(box);
  var status = document.getElementById('status');
  if (status) status.textContent = 'Lastet ikke';
}

function boot() {
  var embedded = null;
  try {
    var block = document.getElementById('appstate');
    if (block && block.textContent && block.textContent.trim() !== 'null') embedded = JSON.parse(block.textContent);
  } catch (error) { embedded = null; }
  try { state = normalize(embedded); }
  catch (error) {
    /* A file whose payload will not parse is a broken file, and re-parsing the same text
       would throw again and leave a dead page with no explanation. So the reader gets a
       message, the event is recorded for the tests, and the page shows an error pane
       instead of pretending to be a plan. */
    window.__loadError = error.message;
    showLoadError(error.message);
    return;
  }

  buildTabs();
  buildPanes();
  wire();
  render();
  showPane((state.panes[0] || {}).id || 'naa', false);

  setInterval(function () { renderNow(); renderBadges(); }, 30000);
  window.addEventListener('beforeprint', function () { /* height is CSS-only here */ });

  document.getElementById('save-file').addEventListener('click', download);
  document.getElementById('open-file').addEventListener('click', function () {
    var picker = document.createElement('input');
    picker.type = 'file';
    picker.accept = '.html,text/html';
    picker.addEventListener('change', function () { if (picker.files && picker.files[0]) importFile(picker.files[0]); });
    picker.click();
  });
  document.getElementById('print').addEventListener('click', function () { window.print(); });
  document.getElementById('reset').addEventListener('click', resetAll);
  markSaved('Klar');
}

document.addEventListener('DOMContentLoaded', boot);
</script>
</body>
</html>
