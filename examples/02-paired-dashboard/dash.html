<!-- ===========================================================================
     DATA
     Either inlined below (bundled mode) or loaded from a sibling data.js
     (paired mode). Both set window.DASHBOARD_DATA, so there is one code path.

     Paired mode is the interesting one: data.js is a separate file in the same
     folder. OneDrive/SharePoint syncs it, so updating the data updates every
     copy of the dashboard — no rebuild, no republish, no server.
     A script element with a src attribute works from a file:// page; fetch()
     does not. That is why the data is a .js file assigning a global, not a
     .json file. Worded without the literal tag: this comment ships inside every
     built dashboard, and stray tag text renders visibly in the SharePoint
     preview (docs/01-tenant-constraints.md row 25).
     =========================================================================== -->
<script src="./data.js"></script>
<script>
const DATA = window.DASHBOARD_DATA || [];
const DATA_META = window.DASHBOARD_META || {};

const META = {
  dimension:   "Produkt",   // primary categorical column (bar chart, filter)
  timeColumn:  "Maaned",        // ordered column for the line chart ("" to disable)
  measure:     "Belop",     // numeric column being summed
  filters:     ["Region", "Produkt", "Kanal"],  // e.g. ["Region","Produkt"]
  numberFormat: new Intl.NumberFormat("nb-NO",{maximumFractionDigits:0})
};

/* ---------- tiny helpers ---------------------------------------------------- */
const $ = (id) => document.getElementById(id);
const fmt = (n) => META.numberFormat.format(n);
// Data is text, never markup. Every value from the data (cells, column names, filter
// values, a data.js source line) goes through esc() before it is written as HTML.
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, ch =>
  ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"})[ch]);
// A measure value as a number, or null when the cell is empty or not a number. Null is
// left out of every aggregate: summing it as 0 moves the average and draws a bar or a
// point that the data does not have.
const val = (v) => {
  if (v === null || v === undefined || v === "") return null;
  const n = Number(v);
  return Number.isFinite(n) ? n : null;
};
const valued = (rows, col) => rows.filter(r => val(r[col]) !== null);
const sum = (rows, col) => rows.reduce((a, r) => a + (val(r[col]) ?? 0), 0);
const uniq = (rows, col) => [...new Set(rows.map(r => r[col]))]
  .filter(v => v !== undefined && v !== null && v !== "").sort();

function groupSum(rows, key, measure) {
  const m = new Map();
  for (const r of valued(rows, measure)) m.set(r[key], (m.get(r[key]) || 0) + val(r[measure]));
  return [...m.entries()].map(([k, v]) => ({ key: k, value: v }));
}

/* ---------- state ---------------------------------------------------------- */
let activeFilters = {};
let sortState = { col: META.measure, dir: -1 };

function visibleRows() {
  return LIVE.filter(r => Object.entries(activeFilters)
    .every(([c, v]) => v === "__ALL__" || String(r[c]) === v));
}

/* ---------- tooltip ------------------------------------------------------- */
const tip = $("tip");
function showTip(e, text) {
  tip.textContent = text; tip.style.opacity = 1;
  tip.style.left = (e.clientX + 12) + "px"; tip.style.top = (e.clientY - 8) + "px";
}
function hideTip() { tip.style.opacity = 0; }

/* ---------- chart size ----------------------------------------------------- */
/* Draw in the card's own pixels, so 11 px text stays 11 px. A fixed 640-wide
   viewBox scaled to a 330 px phone card drew it at 6 px. */
function chartSize(svg) {
  const w = Math.round(svg.getBoundingClientRect().width) || 640;
  const W = Math.max(280, w), H = 300;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  return [W, H];
}

/* ---------- SVG bar chart -------------------------------------------------- */
function barChart(svgId, data, opts) {
  const svg = $(svgId); const [W, H] = chartSize(svg);
  const m = { t: 12, r: 16, b: 58, l: 64 };
  const iw = W - m.l - m.r, ih = H - m.t - m.b;
  svg.innerHTML = "";
  if (!data.length) { svg.innerHTML = `<text x="${W / 2}" y="150" text-anchor="middle" class="axis-label">Ingen data</text>`; return; }

  data = [...data].sort((a, b) => b.value - a.value).slice(0, opts.limit || 12);
  const max = Math.max(...data.map(d => d.value), 1);
  const bw = iw / data.length;
  const ns = "http://www.w3.org/2000/svg";
  const el = (t, a) => { const n = document.createElementNS(ns, t);
    for (const k in a) n.setAttribute(k, a[k]); return n; };
  // Under an upright bar a name is cut after 16 characters and drawn at an angle. When
  // a name is longer than that, lay the bars out sideways: each name gets the card's width.
  if (data.some(d => String(d.key).length > 16)) return sideBars(svg, W, H, data, max, el);

  // y gridlines + labels
  for (let i = 0; i <= 4; i++) {
    const y = m.t + ih - (ih * i / 4);
    svg.appendChild(el("line", { class: "gridline", x1: m.l, x2: m.l + iw, y1: y, y2: y }));
    const t = el("text", { class: "axis-label", x: m.l - 8, y: y + 4, "text-anchor": "end" });
    t.textContent = fmt(max * i / 4); svg.appendChild(t);
  }
  svg.appendChild(el("line", { class: "axis", x1: m.l, x2: m.l + iw, y1: m.t + ih, y2: m.t + ih }));

  data.forEach((d, i) => {
    const h = Math.max((d.value / max) * ih, 1);
    const x = m.l + i * bw + bw * 0.15, y = m.t + ih - h;
    const rect = el("rect", { class: "bar", x, y, width: bw * 0.7, height: h, rx: 2 });
    rect.addEventListener("mousemove", e => showTip(e, `${d.key}: ${fmt(d.value)}`));
    rect.addEventListener("mouseleave", hideTip);
    svg.appendChild(rect);
    const lbl = el("text", { class: "axis-label", x: m.l + i * bw + bw / 2,
      y: m.t + ih + 16, "text-anchor": "end",
      transform: `rotate(-35 ${m.l + i * bw + bw / 2} ${m.t + ih + 16})` });
    lbl.textContent = String(d.key).length > 16 ? String(d.key).slice(0, 15) + "…" : d.key;
    svg.appendChild(lbl);
  });
}

function sideBars(svg, W, H, data, max, el) {
  const width = t => t.getComputedTextLength() || t.textContent.length * 6.5;
  const labels = data.map(d => {
    const t = el("text", { class: "axis-label", "text-anchor": "end" });
    t.textContent = d.key; svg.appendChild(t); return t;
  });
  // The name column is as wide as the longest name, up to 45 % of the chart. A name
  // that is wider still (on a phone) is cut, and keeps its full text as a tooltip.
  const lw = Math.min(Math.round(W * 0.45), Math.max(...labels.map(width)));
  labels.forEach((t, i) => {
    const full = String(data[i].key);
    if (width(t) <= lw) return;
    for (let n = full.length - 1; n > 1 && width(t) > lw; n--) t.textContent = full.slice(0, n) + "…";
    const title = el("title", {}); title.textContent = full; t.appendChild(title);
  });

  const m = { t: 8, r: 32, b: 28, l: lw + 16 };
  const iw = W - m.l - m.r, ih = H - m.t - m.b, rowH = ih / data.length;
  const bh = Math.min(rowH * 0.7, 28);
  // Up to four steps on the value axis, fewer when the numbers would touch (a phone).
  const probe = el("text", { class: "axis-label" }); probe.textContent = fmt(max);
  svg.appendChild(probe);
  const steps = Math.max(1, Math.min(4, Math.floor(iw / (width(probe) + 16))));
  probe.remove();
  for (let i = 0; i <= steps; i++) {
    const x = m.l + iw * i / steps;
    svg.appendChild(el("line", { class: "gridline", x1: x, x2: x, y1: m.t, y2: m.t + ih }));
    const t = el("text", { class: "axis-label", x, y: m.t + ih + 18, "text-anchor": "middle" });
    t.textContent = fmt(max * i / steps); svg.appendChild(t);
  }
  svg.appendChild(el("line", { class: "axis", x1: m.l, x2: m.l, y1: m.t, y2: m.t + ih }));

  data.forEach((d, i) => {
    const mid = m.t + i * rowH + rowH / 2;
    const rect = el("rect", { class: "bar", x: m.l, y: mid - bh / 2, rx: 2, height: bh,
      width: Math.max((d.value / max) * iw, 1) });
    rect.addEventListener("mousemove", e => showTip(e, `${d.key}: ${fmt(d.value)}`));
    rect.addEventListener("mouseleave", hideTip);
    svg.appendChild(rect);
    labels[i].setAttribute("x", m.l - 8); labels[i].setAttribute("y", mid + 4);
  });
}

/* ---------- SVG line chart ------------------------------------------------- */
function lineChart(svgId, data) {
  const svg = $(svgId); const [W, H] = chartSize(svg);
  const m = { t: 12, r: 16, b: 48, l: 64 };
  const iw = W - m.l - m.r, ih = H - m.t - m.b;
  svg.innerHTML = "";
  if (data.length < 2) { svg.innerHTML = `<text x="${W / 2}" y="150" text-anchor="middle" class="axis-label">For få punkter</text>`; return; }

  const max = Math.max(...data.map(d => d.value), 1);
  const ns = "http://www.w3.org/2000/svg";
  const el = (t, a) => { const n = document.createElementNS(ns, t);
    for (const k in a) n.setAttribute(k, a[k]); return n; };
  const X = i => m.l + (iw * i / (data.length - 1));
  const Y = v => m.t + ih - (ih * v / max);

  for (let i = 0; i <= 4; i++) {
    const y = m.t + ih - (ih * i / 4);
    svg.appendChild(el("line", { class: "gridline", x1: m.l, x2: m.l + iw, y1: y, y2: y }));
    const t = el("text", { class: "axis-label", x: m.l - 8, y: y + 4, "text-anchor": "end" });
    t.textContent = fmt(max * i / 4); svg.appendChild(t);
  }
  svg.appendChild(el("line", { class: "axis", x1: m.l, x2: m.l + iw, y1: m.t + ih, y2: m.t + ih }));
  svg.appendChild(el("path", { class: "line-path",
    d: data.map((d, i) => `${i ? "L" : "M"}${X(i)},${Y(d.value)}`).join(" ") }));

  data.forEach((d, i) => {
    const c = el("circle", { class: "dot", cx: X(i), cy: Y(d.value), r: 4 });
    c.addEventListener("mousemove", e => showTip(e, `${d.key}: ${fmt(d.value)}`));
    c.addEventListener("mouseleave", hideTip);
    svg.appendChild(c);
    const step = Math.ceil(data.length / Math.max(2, Math.floor(iw / 56)));  // 10 labels at 640
    if (i % step === 0 || i === data.length - 1) {
      const t = el("text", { class: "axis-label", x: X(i), y: m.t + ih + 18, "text-anchor": "middle" });
      t.textContent = d.key; svg.appendChild(t);
    }
  });
}

/* ---------- KPIs ---------------------------------------------------------- */
function renderKpis(rows) {
  const total = sum(rows, META.measure);
  const dims = uniq(rows, META.dimension).length;
  const n = valued(rows, META.measure).length;
  const avg = n ? total / n : 0;
  const cards = [
    { label: `Total ${META.measure}`, value: fmt(total) },
    { label: "Antall rader", value: fmt(rows.length) },
    { label: `Unike ${META.dimension}`, value: fmt(dims) },
    { label: "Gjennomsnitt", value: fmt(avg) }
  ];
  $("kpis").innerHTML = cards.map(c =>
    `<div class="kpi"><div class="label">${c.label}</div><div class="value">${c.value}</div></div>`).join("");
}

/* ---------- table --------------------------------------------------------- */
function renderTable(rows) {
  const cols = rows.length ? Object.keys(rows[0]) : [];
  // Numeric if any row has a number there: rows[0] may be empty.
  const numCols = new Set(cols.filter(c => rows.some(r => typeof r[c] === "number")));
  const isNum = c => numCols.has(c);
  $("tbl").querySelector("thead").innerHTML = "<tr>" + cols.map(c =>
    `<th class="${isNum(c) ? "num" : ""}" data-col="${esc(c)}">${esc(c)}${
      sortState.col === c ? (sortState.dir < 0 ? " ▾" : " ▴") : ""}</th>`).join("") + "</tr>";

  const sorted = [...rows].sort((a, b) => {
    const x = a[sortState.col], y = b[sortState.col];
    if (typeof x === "number" && typeof y === "number") return (x - y) * sortState.dir;
    return String(x ?? "").localeCompare(String(y ?? ""), "nb") * sortState.dir;
  }).slice(0, 500);

  $("tbl").querySelector("tbody").innerHTML = sorted.map(r => "<tr>" + cols.map(c =>
    `<td class="${isNum(c) ? "num" : ""}">${
      typeof r[c] === "number" ? fmt(r[c]) : esc(r[c])}</td>`).join("") + "</tr>").join("");

  $("rowcount").textContent = `(viser ${Math.min(sorted.length, 500)} av ${rows.length})`;
  $("tbl").querySelectorAll("th").forEach(th => th.onclick = () => {
    const c = th.dataset.col;
    sortState = { col: c, dir: sortState.col === c ? -sortState.dir : -1 };
    renderTable(visibleRows());
  });
}

/* ---------- filters ------------------------------------------------------- */
function renderControls() {
  $("controls").innerHTML = META.filters.map(c => `<div>
      <label for="f_${esc(c)}">${esc(c)}</label>
      <select id="f_${esc(c)}" data-col="${esc(c)}">
        <option value="__ALL__">Alle</option>
        ${uniq(LIVE, c).map(v => `<option value="${esc(v)}">${esc(v)}</option>`).join("")}
      </select></div>`).join("")
    + `<div><label>&nbsp;</label><button id="reset" type="button">Nullstill</button></div>`;

  META.filters.forEach(c => {
    activeFilters[c] = "__ALL__";
    $(`f_${c}`).onchange = e => { activeFilters[c] = e.target.value; render(); };
  });
  const rb = $("reset");
  if (rb) rb.onclick = () => { META.filters.forEach(c => {
    activeFilters[c] = "__ALL__"; $(`f_${c}`).value = "__ALL__"; }); render(); };
}

/* ---------- CSV in, data.js out -------------------------------------------
   Lets someone update the numbers with no tooling at all:
     drag a CSV onto the dashboard  ->  see it render
     click "Lagre datafil"          ->  get a data.js
     drop that in the SharePoint folder  ->  everyone is updated
   ------------------------------------------------------------------------- */
function parseNum(v){
  if (typeof v === "number") return v;
  if (typeof v !== "string") return null;
  let t = v.trim().replace(/\u00a0/g, "").replace(/ /g, "");
  if (!t) return null;
  if (t.includes(",") && t.includes(".")) t = t.replace(/\./g, "").replace(",", ".");
  else if (t.includes(",")) t = t.replace(",", ".");
  t = t.replace(/%$/, "");
  const n = Number(t);
  return Number.isFinite(n) ? n : null;
}

function parseCSV(text){
  const lines = text.replace(/\r\n?/g, "\n").split("\n").filter(l => l.trim() !== "");
  if (!lines.length) return [];
  const guess = (lines[0].match(/;/g) || []).length > (lines[0].match(/,/g) || []).length
    ? ";" : ((lines[0].match(/\t/g) || []).length ? "\t" : ",");
  const split = (line) => {           // handles "quoted, fields"
    const out = []; let cur = "", q = false;
    for (let i = 0; i < line.length; i++){
      const c = line[i];
      if (q){
        if (c === '"' && line[i+1] === '"'){ cur += '"'; i++; }
        else if (c === '"'){ q = false; }
        else cur += c;
      } else if (c === '"'){ q = true; }
      else if (c === guess){ out.push(cur); cur = ""; }
      else cur += c;
    }
    out.push(cur); return out.map(x => x.trim());
  };
  const head = split(lines[0]);
  const rows = lines.slice(1).map(l => {
    const cells = split(l), o = {};
    head.forEach((h, i) => o[h] = cells[i] !== undefined ? cells[i] : "");
    return o;
  });
  // a column becomes numeric only if EVERY non-empty value parses (same rule as the builder,
  // so an ID column that looks numeric survives as text). Empty stays null, never 0.
  for (const col of head){
    const vals = rows.map(r => r[col]).filter(v => v !== "" && v != null);
    if (vals.length && vals.every(v => parseNum(v) !== null))
      rows.forEach(r => r[col] = r[col] === "" ? null : parseNum(r[col]));
  }
  return rows;
}

// data.js may carry either JSON (window.DASHBOARD_DATA) or raw CSV
// (window.DASHBOARD_CSV) — the latter is hand-editable in Notepad.
let LIVE = (typeof window.DASHBOARD_CSV === "string" && window.DASHBOARD_CSV.trim())
  ? parseCSV(window.DASHBOARD_CSV)
  : DATA.slice();
function loadRows(rows, label){
  if (!rows.length){ alert("Fant ingen rader i filen."); return; }
  const missing = [META.dimension, META.measure].filter(c => !(c in rows[0]));
  if (missing.length){
    alert("Filen mangler kolonnen(e): " + missing.join(", ") +
          "\nFant: " + Object.keys(rows[0]).join(", "));
    return;
  }
  LIVE = rows;
  DATA_META.generated = new Date().toISOString().slice(0, 16).replace("T", " ");
  DATA_META.source = label;
  document.getElementById("export").disabled = false;
  renderControls(); render();
  const el = document.getElementById("meta");
  if (el) el.innerHTML = `${esc(label)} &middot; lest lokalt ${DATA_META.generated} &middot; ` +
    `${fmt(rows.length)} rader &middot; <strong>ikke lagret ennå</strong>`;
}

function readFile(file){
  const r = new FileReader();
  r.onload = () => {
    const txt = String(r.result);
    try {
      loadRows(file.name.toLowerCase().endsWith(".json") ? JSON.parse(txt) : parseCSV(txt),
               file.name);
    } catch (e) { alert("Klarte ikke lese filen: " + e.message); }
  };
  r.readAsText(file, "utf-8");
}

(function wireDrop(){
  const bar = $("dropbar"); if (!bar) return;
  const stop = e => { e.preventDefault(); e.stopPropagation(); };
  ["dragenter","dragover"].forEach(ev => document.addEventListener(ev, e => {
    stop(e); bar.classList.add("over"); }));
  ["dragleave","drop"].forEach(ev => document.addEventListener(ev, e => {
    stop(e); if (ev === "dragleave" && e.relatedTarget) return; bar.classList.remove("over"); }));
  document.addEventListener("drop", e => {
    const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if (f) readFile(f);
  });
  $("pick").onchange = e => { if (e.target.files[0]) readFile(e.target.files[0]); };

  $("export").onclick = () => {
    // backticks / ${ would break a template literal, so ship JSON — always safe
    const body =
      "// Datafil for dette dashboardet. Bytt ut denne filen for å oppdatere tallene.\n" +
      "// Generert " + new Date().toISOString() + " fra " + (DATA_META.source || "ukjent kilde") + "\n" +
      "window.DASHBOARD_DATA=" + JSON.stringify(LIVE) + ";\n" +
      "window.DASHBOARD_META=" + JSON.stringify({
        generated: DATA_META.generated, source: DATA_META.source, rows: LIVE.length }) + ";\n";
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([body], { type: "text/javascript" }));
    a.download = "data.js"; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  };
})();

/* ---------- render loop --------------------------------------------------- */
function renderCharts(rows) {
  barChart("chart1", groupSum(rows, META.dimension, META.measure), { limit: 12 });
  if (META.timeColumn) {
    const byTime = groupSum(rows, META.timeColumn, META.measure)
      .sort((a, b) => String(a.key).localeCompare(String(b.key), "nb"));
    lineChart("chart2", byTime);
  } else {
    const [W] = chartSize($("chart2"));
    $("chart2").innerHTML = `<text x="${W / 2}" y="150" text-anchor="middle" class="axis-label">Ingen tidskolonne</text>`;
  }
}

function render() {
  const rows = visibleRows();
  renderKpis(rows);
  renderCharts(rows);
  renderTable(rows);
}

/* Redraw the charts, not the table, when a chart card changes width.
   Watch the cards themselves, not only window "resize": a host can give the frame its
   size without ever firing resize (measured in an Atlassian Artifacts embed inside a
   Confluence page, docs/29). The charts would then keep the width they were drawn at
   while the frame was still 0 x 0. Only a change of width redraws, so the height change a
   redraw causes cannot loop. */
let resizeFrame = 0;
const queueChartRedraw = () => {
  cancelAnimationFrame(resizeFrame);
  resizeFrame = requestAnimationFrame(() => renderCharts(visibleRows()));
};
addEventListener("resize", queueChartRedraw);
if (typeof ResizeObserver === "function") {
  const seenW = new WeakMap();
  const chartObserver = new ResizeObserver(entries => {
    const widthChanged = entries.some(e => {
      const w = Math.round(e.contentRect.width), was = seenW.get(e.target);
      seenW.set(e.target, w);
      return was !== undefined && w !== was;
    });
    if (widthChanged) queueChartRedraw();
  });
  ["chart1", "chart2"].forEach(id => chartObserver.observe($(id)));
}

(function footNote(){
  const el = document.getElementById("footnote"); if (!el) return;
  el.innerHTML = "paired" === "paired"
    ? 'Dataene ligger i <code>data.js</code> ved siden av denne filen. Bytt den ut, og alle ser nye tall.'
    : 'Tallene er bygget inn i denne filen. Oppdater dem med <code>tun-data</code>.';
})();

/* ---------- header meta (freshness comes from the DATA, not the shell) ----- */
(function renderMeta(){
  const asOf = DATA_META.generated || "2026-10-16 15:00 CEST";
  const src  = DATA_META.source || "salgsdata.csv";
  const mode = "paired";
  const rows = LIVE.length ? fmt(LIVE.length) : "0";
  const note = mode === "paired"
    ? '<strong>oppdateres n\u00e5r datafilen synkes</strong>'
    : '<strong>fast \u00f8yeblikksbilde</strong>';
  const el = document.getElementById("meta");
  if (el) el.innerHTML = `${esc(src)} &middot; data per ${esc(asOf)} &middot; ${rows} rader &middot; ${note}`;
})();

/* ---------- init ---------------------------------------------------------- */
if (!Array.isArray(LIVE) || !LIVE.length) {
  document.querySelector("main").innerHTML =
    '<p class="empty">Ingen data ble bygget inn i denne filen.</p>';
} else {
  renderControls();
  render();
}
</script>
