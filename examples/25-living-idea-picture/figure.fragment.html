<div class="lv-panels">
  <div class="lv-p lv-p-all">
    <p>Kjernen er åpen og felles. Ut av den kommer én fil, ikke et system å drifte.
    Filen legges der arbeidet allerede ligger, og mappen er adgangskontrollen.
    Velg en rolle over for å se din del av bildet.</p>
    <p>Tún er et rammeverk uten rammeverk: vanlig HTML, CSS og JavaScript, uten
    bibliotek å installere eller holde ved like. JavaScript er lov, men brukes bare
    der det trengs. Dette bildet trengte det ikke: bevegelse, valg og avspilling er
    ren CSS.</p>
  </div>
  <div class="lv-p lv-p-author">
    <h3>Forfatteren</h3>
    <p>Du skriver vanlig tekst i Markdown og velger en oppskrift, en skill. Tún legger
    alt inn i én HTML-fil, også tallene. Du trenger ingen server og ingen plattform å
    be om tilgang til.</p>
    <p>Tún kommer som en plugin til AI-verktøyet du allerede bruker. Du sier hva du vil
    ha, AI-en følger oppskriften, og du itererer: tune med AI, tunfeste det som virker.</p>
  </div>
  <div class="lv-p lv-p-reader">
    <h3>Leseren</h3>
    <p>Leseren åpner filen uten lisens, uten å installere noe og uten nett. Svaret
    kommer i en vanlig melding, og det er nok: neste versjon blir bedre av det.</p>
  </div>
  <div class="lv-p lv-p-community">
    <h3>Fellesskapet</h3>
    <p>En skill er en oppskrift som går fra hus til hus på tunet. Den som bruker den,
    kan gjøre den litt bedre. Det som virket, blir liggende igjen til den neste.</p>
  </div>
  <div class="lv-p lv-p-host">
    <h3>Verten</h3>
    <p class="lv-hosts" role="group" aria-label="Velg en vert">
      <label for="lv-h-sp">SharePoint</label><label for="lv-h-od">OneDrive</label><label for="lv-h-teams">Teams</label><label for="lv-h-conf">Confluence</label><label for="lv-h-mail">E-post</label><label for="lv-h-usb">Minnepinne</label><label for="lv-h-sky">Sky</label>
    </p>
    <p class="lv-ht lv-ht-none">Velg en vert. Hver linje sier hva som er målt der, og når.</p>
    <p class="lv-ht lv-ht-sp">Lenken til selve filen laster den ned. I forhåndsvisningen kjører filen, men ingenting kan lastes ned eller skrives ut fra den. Målt 2026-10-08.</p>
    <p class="lv-ht lv-ht-od">Fra en synkronisert mappe åpnes filen fra disk og virker fullt. En OneDrive-lenke i en e-post virket på PC, men på mobil reagerte ingenting. Målt september 2026, på én telefon.</p>
    <p class="lv-ht lv-ht-teams">En lenke limt inn i en melding og åpnet fra forhåndsvisningskortet virket på PC og mobil. Den rene tekstlenken under kortet viste kildekoden. Målt september 2026.</p>
    <p class="lv-ht lv-ht-conf">En fil i Atlassian Artifacts kjører i en sandkasse, alene og inne i en Confluence-side. Data i en fil ved siden av lastes ikke der, og ingenting kan lagres mellom besøk. En publisert fil kan alle i organisasjonen åpne med lenken. Målt 2026-10-13.</p>
    <p class="lv-ht lv-ht-mail">Et vedlegg i e-postappens forhåndsvisning på iPhone kjørte ikke kode, men den statiske siden sto og kunne leses. Bygg filen så den virker uten kode. Målt 2026-09-28.</p>
    <p class="lv-ht lv-ht-usb">Lastet ned og åpnet fra disk, uten nett, virket filen på PC og mobil. Det er grunntilfellet. Alt annet er en bonus.</p>
    <p class="lv-ht lv-ht-sky">Et statisk nettsted serverer filen som den er, slik som denne siden. Mål det som faktisk leveres: et kantnettverk kan legge et skript inn i siden uten at du ser det.</p>
