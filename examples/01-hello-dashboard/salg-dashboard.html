/* ==========================================================================
   Palette: neutral (core default)

   The eight semantic slots the theme files consume, with values that belong to
   nobody. This file is what makes core shippable without a brand plugin: with
   plugins/ empty, a build still produces a coherent artefact rather than an
   artefact full of unresolved var() references, which would render as
   invisible or wrong colours and pass every other gate.

   A brand plugin replaces this file by providing `tokens` (see
   docs/22-plugin-contract.md). It does not patch it.

   The values are a deliberately plain slate-and-amber pair: legible, adequate

   ========================================================================== */

/* ==========================================================================
   Status / semantic colour tokens — positive, negative, neutral
   Owned by core, not by any brand plugin: status colour is a functional
   signal, so it must work the same whichever plugin supplies the brand.

   Why not reuse the brand palette: brand accents are chosen to look good,
   not to be read as text. A KPI delta must pass the WCAG 2.2 text minimum
   (4.5:1 against #FFFFFF), and typical warm brand accents do not.

   Contrast against #FFFFFF, computed with the WCAG relative-luminance formula:
     Ember  #C9372C  ->  5.16:1  PASS
     Moss   #1F7A5C  ->  5.25:1  PASS
   For comparison, the example plugin's warm accents (Amber, Flame; see
   plugins/eksempel/tokens/palette.css) measure 2.47:1 and 2.84:1, below even
   the 3:1 icon minimum, so neither is usable for status.

   Default status pair: Ember/Moss (WCAG AA, see contrast table above).
   A project may use a different pair if it passes the same contrast test;
   see docs/09-usability-and-navigation-principles.md §3.

   Per WCAG 2.2 criterion 1.4.1 (Use of Color): colour alone must never be the only
   signal. Pair these with an icon or text label (e.g. an arrow, or the words
   "opp"/"ned"), not colour by itself.
   ========================================================================== */
:root{
  --status-negative:          #C9372C; /* Ember — text, icon, delta value */
  --status-negative-bg:       #fbeded; /* Ember 8% — row/card background tint only */
  --status-positive:          #1F7A5C; /* Moss — text, icon, delta value */
  --status-positive-bg-25:    #d7ece3; /* Moss 25% — background tint only */
  --status-positive-bg-12:    #eaf5f0; /* Moss 12% — subtler background tint */
  --status-neutral:           #737373; /* neutral grey — no change / n.a. */
}

/* ==========================================================================
   Theme: light (default)
   ==========================================================================
   Maps the semantic roles the templates already use (--ink, --muted, --bg,
   --brand, etc.) onto the active palette (palette-neutral.css, or a brand plugin's tokens/palette.css) and status-semantic.css, instead of
   each template hardcoding its own hex values as it does today.

   NOT YET WIRED INTO templates: html files — this file documents the
   intended mapping so it can be reviewed before any template changes. Load
   order for a future build: the active palette (palette-neutral.css, or a brand plugin's tokens/palette.css), then status-semantic.css,
   then this file (so the palette- and status- prefixed variables it references
   already exist).

   Rationale for a light default: a dashboard is read repeatedly and at
   length — Nielsen Norman Group and general dashboard-UX guidance favour a
   neutral, low-chroma background with colour reserved for data, not the
   bold colour-dominant background a presentation theme documents for slides.
   See docs/09-usability-and-navigation-principles.md §4.

:root,
:root[data-theme="light"]{
  --ink:        var(--palette-ink);      /* body text */
  --muted:      #737373;               /* neutral grey: labels, axis text (4.7:1 on white) */
  --line:       #ebebeb;               /* neutral grey: borders, gridlines */
  --bg:         var(--palette-surface);
  --panel:      #f8f8f8;               /* neutral grey: cards, filter bar */
  --brand:      var(--palette-primary);        /* primary data colour, links, focus */
  --brand-dark: var(--palette-primary-dark);    /* header background */
  --series-2:   var(--palette-accent);     /* secondary chart series — decorative use only, not text */

  --ok:    var(--status-positive);
  --ok-bg: var(--status-positive-bg-12);
  --bad:   var(--status-negative);
  --bad-bg:var(--status-negative-bg);
}

  :root{

       neutral values chosen here, not taken from any brand. */
    --border:#ccc;                        /* neutral grey: input and dashed borders */
    --highlight:#eef2f7;                  /* pale neutral slate: row hover, drop target */
    --tooltip-bg:var(--palette-ink);
    --on-brand:var(--palette-on-dark);    /* text on --brand-dark */

    --sp-1:0.5rem; --sp-2:1rem; --sp-3:1.5rem; --sp-4:2rem;
  }
  *{box-sizing:border-box}

<script>
const DATA = window.DASHBOARD_DATA || [];
const DATA_META = window.DASHBOARD_META || {};

const META = {
  dimension:   "Produkt",   // primary categorical column (bar chart, filter)
  timeColumn:  "Maaned",        // ordered column for the line chart ("" to disable)
  measure:     "Belop",     // numeric column being summed
  filters:     ["Region", "Produkt", "Kanal"],  // e.g. ["Region","Produkt"]
  numberFormat: new Intl.NumberFormat("nb-NO",{maximumFractionDigits:0})
};

/* ---------- tiny helpers ---------------------------------------------------- */
const $ = (id) => document.getElementById(id);
const fmt = (n) => META.numberFormat.format(n);
const sum = (rows, col) => rows.reduce((a, r) => a + (Number(r[col]) || 0), 0);
const uniq = (rows, col) => [...new Set(rows.map(r => r[col]))]
  .filter(v => v !== undefined && v !== null && v !== "").sort();

function groupSum(rows, key, measure) {
  const m = new Map();
  for (const r of rows) m.set(r[key], (m.get(r[key]) || 0) + (Number(r[measure]) || 0));
  return [...m.entries()].map(([k, v]) => ({ key: k, value: v }));
}

/* ---------- state ---------------------------------------------------------- */
let activeFilters = {};
let sortState = { col: META.measure, dir: -1 };

function visibleRows() {
  return LIVE.filter(r => Object.entries(activeFilters)
    .every(([c, v]) => v === "__ALL__" || String(r[c]) === v));
}

/* ---------- tooltip ------------------------------------------------------- */
const tip = $("tip");
function showTip(e, text) {
  tip.textContent = text; tip.style.opacity = 1;
  tip.style.left = (e.clientX + 12) + "px"; tip.style.top = (e.clientY - 8) + "px";
}
function hideTip() { tip.style.opacity = 0; }

/* ---------- SVG bar chart -------------------------------------------------- */
function barChart(svgId, data, opts) {
  const svg = $(svgId); const W = 640, H = 300;
  const m = { t: 12, r: 16, b: 58, l: 64 };
  const iw = W - m.l - m.r, ih = H - m.t - m.b;
  svg.innerHTML = "";
  if (!data.length) { svg.innerHTML = '<text x="320" y="150" text-anchor="middle" class="axis-label">Ingen data</text>'; return; }

  data = [...data].sort((a, b) => b.value - a.value).slice(0, opts.limit || 12);
  const max = Math.max(...data.map(d => d.value), 1);
  const bw = iw / data.length;
  const ns = "http://www.w3.org/2000/svg";
  const el = (t, a) => { const n = document.createElementNS(ns, t);
    for (const k in a) n.setAttribute(k, a[k]); return n; };

  // y gridlines + labels
  for (let i = 0; i <= 4; i++) {
    const y = m.t + ih - (ih * i / 4);
    svg.appendChild(el("line", { class: "gridline", x1: m.l, x2: m.l + iw, y1: y, y2: y }));
    const t = el("text", { class: "axis-label", x: m.l - 8, y: y + 4, "text-anchor": "end" });
    t.textContent = fmt(max * i / 4); svg.appendChild(t);
  }
  svg.appendChild(el("line", { class: "axis", x1: m.l, x2: m.l + iw, y1: m.t + ih, y2: m.t + ih }));

  data.forEach((d, i) => {
    const h = Math.max((d.value / max) * ih, 1);
    const x = m.l + i * bw + bw * 0.15, y = m.t + ih - h;
    const rect = el("rect", { class: "bar", x, y, width: bw * 0.7, height: h, rx: 2 });
    rect.addEventListener("mousemove", e => showTip(e, `${d.key}: ${fmt(d.value)}`));
    rect.addEventListener("mouseleave", hideTip);
    svg.appendChild(rect);
    const lbl = el("text", { class: "axis-label", x: m.l + i * bw + bw / 2,
      y: m.t + ih + 16, "text-anchor": "end",
      transform: `rotate(-35 ${m.l + i * bw + bw / 2} ${m.t + ih + 16})` });
    lbl.textContent = String(d.key).length > 16 ? String(d.key).slice(0, 15) + "…" : d.key;
    svg.appendChild(lbl);
  });
}

/* ---------- SVG line chart ------------------------------------------------- */
function lineChart(svgId, data) {
  const svg = $(svgId); const W = 640, H = 300;
  const m = { t: 12, r: 16, b: 48, l: 64 };
  const iw = W - m.l - m.r, ih = H - m.t - m.b;
  svg.innerHTML = "";
  if (data.length < 2) { svg.innerHTML = '<text x="320" y="150" text-anchor="middle" class="axis-label">For få punkter</text>'; return; }

  const max = Math.max(...data.map(d => d.value), 1);
  const ns = "http://www.w3.org/2000/svg";
  const el = (t, a) => { const n = document.createElementNS(ns, t);
    for (const k in a) n.setAttribute(k, a[k]); return n; };
  const X = i => m.l + (iw * i / (data.length - 1));
  const Y = v => m.t + ih - (ih * v / max);

  for (let i = 0; i <= 4; i++) {
    const y = m.t + ih - (ih * i / 4);
    svg.appendChild(el("line", { class: "gridline", x1: m.l, x2: m.l + iw, y1: y, y2: y }));
    const t = el("text", { class: "axis-label", x: m.l - 8, y: y + 4, "text-anchor": "end" });
    t.textContent = fmt(max * i / 4); svg.appendChild(t);
  }
  svg.appendChild(el("line", { class: "axis", x1: m.l, x2: m.l + iw, y1: m.t + ih, y2: m.t + ih }));
  svg.appendChild(el("path", { class: "line-path",
    d: data.map((d, i) => `${i ? "L" : "M"}${X(i)},${Y(d.value)}`).join(" ") }));

  data.forEach((d, i) => {
    const c = el("circle", { class: "dot", cx: X(i), cy: Y(d.value), r: 4 });
    c.addEventListener("mousemove", e => showTip(e, `${d.key}: ${fmt(d.value)}`));
    c.addEventListener("mouseleave", hideTip);
    svg.appendChild(c);
    const step = Math.ceil(data.length / 10);
    if (i % step === 0 || i === data.length - 1) {
      const t = el("text", { class: "axis-label", x: X(i), y: m.t + ih + 18, "text-anchor": "middle" });
      t.textContent = d.key; svg.appendChild(t);
    }
  });
}

/* ---------- KPIs ---------------------------------------------------------- */
function renderKpis(rows) {
  const total = sum(rows, META.measure);
  const dims = uniq(rows, META.dimension).length;
  const avg = rows.length ? total / rows.length : 0;
  const cards = [
    { label: `Total ${META.measure}`, value: fmt(total) },
    { label: "Antall rader", value: fmt(rows.length) },
    { label: `Unike ${META.dimension}`, value: fmt(dims) },
    { label: "Gjennomsnitt", value: fmt(avg) }
  ];
  $("kpis").innerHTML = cards.map(c =>
    `<div class="kpi"><div class="label">${c.label}</div><div class="value">${c.value}</div></div>`).join("");
}

/* ---------- table --------------------------------------------------------- */
function renderTable(rows) {
  const cols = rows.length ? Object.keys(rows[0]) : [];
  const isNum = c => rows.length && typeof rows[0][c] === "number";
  $("tbl").querySelector("thead").innerHTML = "<tr>" + cols.map(c =>
    `<th class="${isNum(c) ? "num" : ""}" data-col="${c}">${c}${
      sortState.col === c ? (sortState.dir < 0 ? " ▾" : " ▴") : ""}</th>`).join("") + "</tr>";

  const sorted = [...rows].sort((a, b) => {
    const x = a[sortState.col], y = b[sortState.col];
    if (typeof x === "number" && typeof y === "number") return (x - y) * sortState.dir;
    return String(x ?? "").localeCompare(String(y ?? ""), "nb") * sortState.dir;
  }).slice(0, 500);

  $("tbl").querySelector("tbody").innerHTML = sorted.map(r => "<tr>" + cols.map(c =>
    `<td class="${isNum(c) ? "num" : ""}">${
      typeof r[c] === "number" ? fmt(r[c]) : (r[c] ?? "")}</td>`).join("") + "</tr>").join("");

  $("rowcount").textContent = `(viser ${Math.min(sorted.length, 500)} av ${rows.length})`;
  $("tbl").querySelectorAll("th").forEach(th => th.onclick = () => {
    const c = th.dataset.col;
    sortState = { col: c, dir: sortState.col === c ? -sortState.dir : -1 };
    renderTable(visibleRows());
  });
}

/* ---------- filters ------------------------------------------------------- */
function renderControls() {
  $("controls").innerHTML = META.filters.map(c => `<div>
      <label for="f_${c}">${c}</label>
      <select id="f_${c}" data-col="${c}">
        <option value="__ALL__">Alle</option>
        ${uniq(LIVE, c).map(v => `<option value="${String(v).replace(/"/g, "&quot;")}">${v}</option>`).join("")}
      </select></div>`).join("")
    + `<div><label>&nbsp;</label><button id="reset" type="button">Nullstill</button></div>`;

  META.filters.forEach(c => {
    activeFilters[c] = "__ALL__";
    $(`f_${c}`).onchange = e => { activeFilters[c] = e.target.value; render(); };
  });
  const rb = $("reset");
  if (rb) rb.onclick = () => { META.filters.forEach(c => {
    activeFilters[c] = "__ALL__"; $(`f_${c}`).value = "__ALL__"; }); render(); };
}

/* ---------- CSV in, data.js out -------------------------------------------
   Lets someone update the numbers with no tooling at all:
     drag a CSV onto the dashboard  ->  see it render
     click "Lagre datafil"          ->  get a data.js
     drop that in the SharePoint folder  ->  everyone is updated
   ------------------------------------------------------------------------- */
function parseNum(v){
  if (typeof v === "number") return v;
  if (typeof v !== "string") return null;
  let t = v.trim().replace(/\u00a0/g, "").replace(/ /g, "");
  if (!t) return null;
  if (t.includes(",") && t.includes(".")) t = t.replace(/\./g, "").replace(",", ".");
  else if (t.includes(",")) t = t.replace(",", ".");
  t = t.replace(/%$/, "");
  const n = Number(t);
  return Number.isFinite(n) ? n : null;
}

function parseCSV(text){
  const lines = text.replace(/\r\n?/g, "\n").split("\n").filter(l => l.trim() !== "");
  if (!lines.length) return [];
  const guess = (lines[0].match(/;/g) || []).length > (lines[0].match(/,/g) || []).length
    ? ";" : ((lines[0].match(/\t/g) || []).length ? "\t" : ",");
  const split = (line) => {           // handles "quoted, fields"
    const out = []; let cur = "", q = false;
    for (let i = 0; i < line.length; i++){
      const c = line[i];
      if (q){
        if (c === '"' && line[i+1] === '"'){ cur += '"'; i++; }
        else if (c === '"'){ q = false; }
        else cur += c;
      } else if (c === '"'){ q = true; }
      else if (c === guess){ out.push(cur); cur = ""; }
      else cur += c;
    }
    out.push(cur); return out.map(x => x.trim());
  };
  const head = split(lines[0]);
  const rows = lines.slice(1).map(l => {
    const cells = split(l), o = {};
    head.forEach((h, i) => o[h] = cells[i] !== undefined ? cells[i] : "");
    return o;
  });
  // a column becomes numeric only if EVERY non-empty value parses (same rule as the builder,
  // so an ID column that looks numeric survives as text)
  for (const col of head){
    const vals = rows.map(r => r[col]).filter(v => v !== "" && v != null);
    if (vals.length && vals.every(v => parseNum(v) !== null))
      rows.forEach(r => r[col] = r[col] === "" ? 0 : parseNum(r[col]));
  }
  return rows;
}

// data.js may carry either JSON (window.DASHBOARD_DATA) or raw CSV
// (window.DASHBOARD_CSV) — the latter is hand-editable in Notepad.
let LIVE = (typeof window.DASHBOARD_CSV === "string" && window.DASHBOARD_CSV.trim())
  ? parseCSV(window.DASHBOARD_CSV)
  : DATA.slice();
function loadRows(rows, label){
  if (!rows.length){ alert("Fant ingen rader i filen."); return; }
  const missing = [META.dimension, META.measure].filter(c => !(c in rows[0]));
  if (missing.length){
    alert("Filen mangler kolonnen(e): " + missing.join(", ") +
          "\nFant: " + Object.keys(rows[0]).join(", "));
    return;
  }
  LIVE = rows;
  DATA_META.generated = new Date().toISOString().slice(0, 16).replace("T", " ");
  DATA_META.source = label;
  document.getElementById("export").disabled = false;
  renderControls(); render();
  const el = document.getElementById("meta");
  if (el) el.innerHTML = `${label} &middot; lest lokalt ${DATA_META.generated} &middot; ` +
    `${fmt(rows.length)} rader &middot; <strong>ikke lagret ennå</strong>`;
}

function readFile(file){
  const r = new FileReader();
  r.onload = () => {
    const txt = String(r.result);
    try {
      loadRows(file.name.toLowerCase().endsWith(".json") ? JSON.parse(txt) : parseCSV(txt),
               file.name);
    } catch (e) { alert("Klarte ikke lese filen: " + e.message); }
  };
  r.readAsText(file, "utf-8");
}

(function wireDrop(){
  const bar = $("dropbar"); if (!bar) return;
  const stop = e => { e.preventDefault(); e.stopPropagation(); };
  ["dragenter","dragover"].forEach(ev => document.addEventListener(ev, e => {
    stop(e); bar.classList.add("over"); }));
  ["dragleave","drop"].forEach(ev => document.addEventListener(ev, e => {
    stop(e); if (ev === "dragleave" && e.relatedTarget) return; bar.classList.remove("over"); }));
  document.addEventListener("drop", e => {
    const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if (f) readFile(f);
  });
  $("pick").onchange = e => { if (e.target.files[0]) readFile(e.target.files[0]); };

  $("export").onclick = () => {
    // backticks / ${ would break a template literal, so ship JSON — always safe
    const body =
      "// Datafil for dette dashboardet. Bytt ut denne filen for å oppdatere tallene.\n" +
      "// Generert " + new Date().toISOString() + " fra " + (DATA_META.source || "ukjent kilde") + "\n" +
      "window.DASHBOARD_DATA=" + JSON.stringify(LIVE) + ";\n" +
      "window.DASHBOARD_META=" + JSON.stringify({
        generated: DATA_META.generated, source: DATA_META.source, rows: LIVE.length }) + ";\n";
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([body], { type: "text/javascript" }));
    a.download = "data.js"; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  };
})();

/* ---------- render loop --------------------------------------------------- */
function render() {
  const rows = visibleRows();
  renderKpis(rows);
  barChart("chart1", groupSum(rows, META.dimension, META.measure), { limit: 12 });
  if (META.timeColumn) {
    const byTime = groupSum(rows, META.timeColumn, META.measure)
      .sort((a, b) => String(a.key).localeCompare(String(b.key), "nb"));
    lineChart("chart2", byTime);
  } else {
    $("chart2").innerHTML = '<text x="320" y="150" text-anchor="middle" class="axis-label">Ingen tidskolonne</text>';
  }
  renderTable(rows);
}

(function footNote(){
  const el = document.getElementById("footnote"); if (!el) return;
  el.innerHTML = "bundled" === "paired"
    ? 'Dataene ligger i <code>data.js</code> ved siden av denne filen. Bytt den ut, og alle ser nye tall.'
    : 'Tallene er bygget inn i denne filen. Be RAIWork om <code>tun-data</code> for \u00e5 oppdatere.';
})();

/* ---------- header meta (freshness comes from the DATA, not the shell) ----- */
(function renderMeta(){
  const asOf = DATA_META.generated || "2026-10-06 19:09 CEST";
  const src  = DATA_META.source || "Eksempeldata (syntetisk) — salgsdata.csv";
  const mode = "bundled";
  const rows = LIVE.length ? fmt(LIVE.length) : "0";
  const note = mode === "paired"
    ? '<strong>oppdateres n\u00e5r datafilen synkes</strong>'
    : '<strong>fast \u00f8yeblikksbilde</strong>';
  const el = document.getElementById("meta");
  if (el) el.innerHTML = `${src} &middot; data per ${asOf} &middot; ${rows} rader &middot; ${note}`;
})();

/* ---------- init ---------------------------------------------------------- */
if (!Array.isArray(LIVE) || !LIVE.length) {
  document.querySelector("main").innerHTML =
    '<p class="empty">Ingen data ble bygget inn i denne filen.</p>';
} else {
  renderControls();
  render();
}
</script>
