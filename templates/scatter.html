<html lang="{{T:html_lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{TITLE}}</title>
<!--
  {{TITLE}}
  PROVENANCE  (do not delete - this is how output gets traced back)
    Source data : {{SOURCE_DESCRIPTION}}
    Extracted   : {{EXTRACT_TIMESTAMP}}
    Built       : {{BUILD_TIMESTAMP}}
    Requested by: {{REQUESTED_BY}}
    Made with   : Tún - tun.community
    Records     : {{ROWS_INLINED}} units, one point each

  This is a self-contained artefact: no server, no CDN dependency, no licence required to
  view. It works offline, from a OneDrive/SharePoint-synced folder.

  What this file is: one point per unit in a plane of two measures, so the reader can see
  whether the two move together in this sample, and which units sit apart from the rest.

  What it is NOT: a claim that one measure causes the other. A cloud has a shape, and the
  shape has many possible explanations, including a third measure nobody extracted.

  There is no script in this file.
-->
<style>
/* The colour tokens are inlined by the builder from tools/tokens/: one seam shared with
   every other artefact, which is also how this page follows the operating system's dark
   setting with no script. */
{{TOKEN_CSS}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Eksempel AS","Segoe UI",system-ui,-apple-system,sans-serif;font-size:1rem;line-height:1.5}
header{background:var(--brand-dark);color:var(--on-brand);padding:1.25rem 1.5rem}
header .in{max-width:58rem;margin:0 auto}
h1{margin:0;font-size:1.375rem;line-height:1.75rem;font-weight:600}
header .sub{margin:.25rem 0 0;font-size:.875rem;line-height:1.5;opacity:.9}
main{max-width:58rem;margin:0 auto;padding:1.5rem}
h2{font-size:1.125rem;line-height:1.5rem;margin:2rem 0 .5rem;font-weight:600}
.figure{margin:0;background:var(--panel);border:1px solid var(--line);border-radius:.5rem;
  padding:1rem;overflow:auto}
/* Never narrower than 1 unit = 1 px: the drawing's text is 14 units, and a scaled-down
   drawing is text under the floor. Below that the box pans, and the page never does. */
.figure svg{display:block;width:100%;height:auto;min-width:47.5rem}
.sc-box{fill:none;stroke:var(--line);stroke-width:1}
.sc-grid{stroke:var(--rule);stroke-width:1}
.sc-tick{fill:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.sc-axis-title{fill:var(--ink);font-size:14px;font-weight:600}
.sc-name{fill:var(--ink);font-size:14px}
.sc-fit{stroke:var(--muted);stroke-width:2;stroke-dasharray:6 4}
/* One dot per unit. Colour is the first channel and the shape is the second, so a group is
   still identifiable where two colours are hard to tell apart. */
.sc-dot{fill:var(--cat-1)}
.sc-c1{fill:var(--cat-1)}
.sc-c2{fill:var(--cat-2)}
.sc-c3{fill:var(--cat-3)}
.sc-c4{fill:var(--cat-4)}
.sc-c5{fill:var(--cat-5)}
.sc-c0{fill:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:.25rem 1.25rem;list-style:none;margin:.75rem 0 0;
  padding:0;font-size:.875rem;line-height:1.5}
.legend li{display:flex;align-items:center;gap:.5rem}
.legend svg{width:18px;height:18px;flex:none;overflow:visible}
figcaption{margin:.75rem 0 0;font-size:.875rem;line-height:1.5;color:var(--muted)}
.summary{margin:1rem 0 0;padding:.75rem 1rem;background:var(--brand-soft);border-radius:.5rem;
  font-size:.9375rem;line-height:1.5}
.notes{margin:.75rem 0 0;padding-left:1.25rem;font-size:.9375rem;line-height:1.5}
.notes li{margin:.25rem 0}
table{width:100%;border-collapse:collapse;background:var(--panel);
  border:1px solid var(--line);border-radius:.5rem;font-size:.875rem;line-height:1.5}
caption{text-align:left;padding:0 0 .5rem;color:var(--muted)}
th,td{padding:.5rem .75rem;text-align:left;border-bottom:1px solid var(--line);
  vertical-align:top}
thead th{background:var(--brand-soft);color:var(--on-brand-soft);white-space:nowrap}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
footer{max-width:58rem;margin:0 auto;padding:1rem 1.5rem 2rem;color:var(--muted);font-size:.875rem}
footer p{margin:.25rem 0}
@media (max-width:44rem){
  /* A phone may pan a picture inside its own box; the page never scrolls sideways. */
  .figure{padding:.5rem}
  th,td{padding:.4rem .5rem}
}
@media print{
  body{background:#fff}
  header{background:#fff;color:#000;border-bottom:2px solid #000}
  .figure{overflow:visible;border:0;padding:0}
  .figure svg{min-width:0}
  .summary{background:#fff;padding-left:0}
  table{break-inside:auto}
  tr{break-inside:avoid}
  figure{break-inside:avoid}
}

  /* Dark is a SCREEN choice and paper is white, so this block is scoped to screen: without
     the guard it would come after the print rule above and paint the ink light on a printed
     white page. --brand-dark is the darkest surface in the dark theme and --on-brand resolves
     to --bg there, so the band that reads white-on-ocean in light would be dark on dark. */
  @media screen and (prefers-color-scheme: dark){
    header{color:var(--ink)}
  }
table{display:block;max-width:100%;overflow-x:auto}
</style>
</head>
<body>
<header><div class="in">
  <h1>{{TITLE}}</h1>
  <p class="sub">{{SUBTITLE}}</p>
</div></header>
<main>
  <figure class="figure">
{{DRAWING}}
{{LEGEND}}
    <figcaption>{{CAPTION}}</figcaption>
  </figure>

  <p class="summary">{{SUMMARY}}</p>
  <ul class="notes">
{{NOTES}}
  </ul>

  <h2 id="tbl-h">{{T:head_table}}</h2>
  <table aria-labelledby="tbl-h">
    <caption>{{T:table_caption}}</caption>
{{TABLE}}
  </table>
</main>
<footer>
  <p>{{T:footer_a}}</p>
  <p>{{T:footer_b}}</p>
  <p>{{SOURCE_LINE}} · {{T:footer_built}} {{BUILD_TIMESTAMP}}</p>
  <p>{{FEEDBACK_BLOCK}}</p>
</footer>
</body>
</html>
