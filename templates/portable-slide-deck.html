<html lang="{{T:html_lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E1C2E">
<title>{{ARTIFACT_TITLE}}</title>
<!--
  {{ARTIFACT_TITLE}}
  PROVENANCE
    Source data : {{SOURCE_DESCRIPTION}}
    Built       : {{BUILD_TIMESTAMP}}
    Requested by: {{REQUESTED_BY}}
    Built by    : {{BUILT_BY}}
    Repo        : tun
    Made with   : Tún — tun.community
    Artefact    : portable slide deck
  Self-contained HTML: no server, CDN, account or licence is required to view it.
-->
<style>
/* Palette, inlined when the deck is built: the --palette-* slots from
   tools/tun_tokens.py (core's neutral palette in tools/tokens/palette-neutral.css
   unless a brand plugin supplies one). See examples/18-portable-slide-deck/ for a
   builder. The meta theme-color above cannot read a CSS variable, so it carries the
   neutral palette's darkest value directly. */
{{TOKEN_CSS}}
:root{
  --ink:var(--palette-primary-darkest);
  --paper:var(--palette-on-dark);
  --accent:var(--palette-accent);      /* eyebrows on dark, rail tick, progress bar */
  --accent2:var(--palette-primary);    /* eyebrows and figures on light */
  --muted:#5c6470;                     /* neutral slate grey, no palette slot for it */
  --line:rgba(14,28,46,.14);
  --display:Georgia,"Times New Roman",serif;
  --body:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;height:100dvh;overflow:hidden;background:var(--ink)}
body{font-family:var(--body);color:var(--ink);-webkit-font-smoothing:antialiased;overscroll-behavior:none}
main{position:relative;width:100vw;height:100vh;height:100dvh}
.slide{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;
  padding:7vh 7vw 12vh 15vw;overflow:hidden;background:var(--paper);
  opacity:0;transform:translateX(3%);pointer-events:none;
  transition:opacity .35s ease,transform .35s ease}
.slide.active{z-index:2;opacity:1;transform:none;pointer-events:auto}
.slide.prev{transform:translateX(-3%)}
.slide.dark{background:var(--ink);color:var(--paper)}
/* Attachment previews can suppress JavaScript. Keep the first slide useful. */
html:not(.js) .slide:first-of-type{opacity:1;transform:none;pointer-events:auto;z-index:2}
html:not(.js) #rail,html:not(.js) #controls,html:not(.js) #progress{display:none}
#js-warning{position:fixed;z-index:40;left:50%;bottom:max(14px,env(safe-area-inset-bottom));
  width:min(90vw,680px);padding:12px 16px;transform:translateX(-50%);border-radius:8px;
  background:#fbeded;color:#3d0d0d;font:600 13px/1.4 var(--body);text-align:center}
html.js #js-warning{display:none}
.eyebrow{margin-bottom:2vh;color:var(--accent2);font-size:clamp(10px,.85vw,13px);
  font-weight:700;letter-spacing:.2em;text-transform:uppercase}
.slide.dark .eyebrow{color:var(--accent)}
/* overflow-wrap/word-break: a real, long {{T:c_wrap_kind}} in h1/h2/p can exceed
   its box at any of the clamp() sizes below. .slide has overflow:hidden (by design, to
   clip the slide-change transform), so an unwrapped long word is not just visually
   ugly — it is silently and invisibly clipped, with no scrollbar and no sign anything
   is missing. Reproduced on the shipped template: {{T:c_wrap_a}}
   {{T:c_wrap_b}} in <h1> overflowed its box by 229px on a 390px-wide
   mobile viewport (scrollWidth 564 vs clientWidth 335) and vanished with zero visual
   trace. hyphens:auto is a second, cosmetic layer on top — lang="{{T:html_lang}}" is already set on
   <html>, so supporting browsers get a real hyphen at the break instead of a bare cut. */
h1,h2,p,.card strong,.card span{overflow-wrap:break-word;word-break:break-word;hyphens:auto}
h1,h2{max-width:24ch;font-family:var(--display);font-weight:600;letter-spacing:-.02em}
h1{font-size:clamp(34px,5vw,72px);line-height:1.04}
h2{margin-bottom:2.5vh;font-size:clamp(26px,3.2vw,46px);line-height:1.09}
p{max-width:62ch;color:var(--muted);font-size:clamp(14px,1.3vw,20px);line-height:1.55}
.slide.dark p{color:rgba(247,245,240,.76)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1.5vw;margin-top:4vh}
.card{padding:1.6vw;border:1px solid var(--line);border-radius:4px;background:rgba(255,255,255,.32)}
.card strong{display:block;margin-bottom:1vh;color:var(--accent2);font:600 clamp(24px,3vw,44px)/1 var(--display)}
.card span{font-size:clamp(12px,1vw,16px);line-height:1.4}

#rail{position:fixed;z-index:10;left:2.2vw;top:50%;width:145px;transform:translateY(-50%)}
.rail-sec{display:flex;align-items:center;gap:9px;padding:5px 0;opacity:.7;cursor:pointer}  /* .35 put 9px labels at 2.8:1 */
.rail-sec.on{opacity:1}
.rail-sec .tick{width:13px;height:2px;flex:none;background:currentColor}
.rail-sec.on .tick{width:28px;background:var(--accent)}
.rail-sec .label{max-width:105px;font-size:9px;font-weight:700;letter-spacing:.12em;line-height:1.25;text-transform:uppercase}
body.on-dark #rail{color:var(--paper)}
#progress{position:fixed;z-index:11;left:0;right:0;bottom:0;height:2px;background:rgba(128,128,128,.2)}
#progress i{display:block;width:0;height:100%;background:var(--accent);transition:width .35s ease}
#controls{position:fixed;z-index:20;left:50%;bottom:max(14px,env(safe-area-inset-bottom));
  display:flex;align-items:center;gap:4px;padding:5px;transform:translateX(-50%);
  border:1px solid var(--line);border-radius:999px;background:rgba(247,245,240,.92);
  box-shadow:0 8px 28px rgba(14,28,46,.16);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
body.on-dark #controls{border-color:rgba(247,245,240,.2);background:rgba(14,28,46,.88);box-shadow:0 8px 28px rgba(0,0,0,.28)}
.control-btn{min-width:42px;height:42px;padding:0 13px;border:0;border-radius:999px;
  display:flex;align-items:center;justify-content:center;gap:7px;background:transparent;color:var(--ink);
  font:600 12px/1 var(--body);cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
body.on-dark .control-btn{color:var(--paper)}
.control-btn:hover,.control-btn:focus-visible{outline:none;background:rgba(43,76,126,.13)}
.control-btn:active{transform:scale(.96)}
.control-btn[disabled]{opacity:.28;cursor:default;transform:none}
.control-icon{font-size:20px;line-height:1}
#counter{min-width:52px;padding:0 8px;color:var(--ink);font-size:11px;letter-spacing:.12em;text-align:center;white-space:nowrap;font-variant-numeric:tabular-nums}
body.on-dark #counter{color:var(--paper)}
#toast{position:fixed;z-index:30;left:50%;bottom:88px;width:min(88vw,560px);
  padding:12px 16px;transform:translate(-50%,12px);border-radius:10px;
  background:#101820;color:#fff;font:500 13px/1.4 var(--body);text-align:center;
  opacity:0;pointer-events:none;box-shadow:0 8px 28px rgba(0,0,0,.28);transition:opacity .2s,transform .2s}
#toast.show{opacity:1;transform:translate(-50%,0)}

@media(hover:hover) and (pointer:fine){
  #controls{opacity:.75;transition:opacity .2s}  /* idle, still 4.5:1 for its text */
  #controls:hover,#controls:focus-within{opacity:1}
}
@media(hover:none),(pointer:coarse){
  .control-btn{min-width:48px;height:48px;font-size:13px}
  #controls{padding:6px;gap:3px}
}
@media(orientation:portrait) and (max-width:700px){
  #rail{display:none}
  .slide{padding:max(7vh,env(safe-area-inset-top)) 7vw max(14vh,104px);justify-content:center}
  h1{font-size:clamp(36px,10vw,54px)}
  h2{font-size:clamp(28px,7vw,40px)}
  p{font-size:clamp(15px,4vw,19px)}
  .grid{grid-template-columns:1fr;gap:1.5vh;margin-top:2.5vh}
  .card{padding:1.8vh 4vw}
  #controls{bottom:max(12px,env(safe-area-inset-bottom))}
}
@media(orientation:landscape) and (hover:none),
       (orientation:landscape) and (pointer:coarse){
  .slide{padding-bottom:max(13vh,78px)}
  #controls{bottom:max(8px,env(safe-area-inset-bottom))}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{
  html,body{height:auto;overflow:visible}
  #rail,#progress,#controls,#toast{display:none}
  main{height:auto}
  .slide{position:relative;height:100vh;opacity:1;transform:none;page-break-after:always}
}
</style>
</head>
<body>
<script>document.documentElement.className+=" js"</script>
<div id="js-warning">{{T:js_warning}}</div>
<nav id="rail" aria-label="{{T:rail_label}}"><div id="railnav"></div></nav>
<main>
  <!-- Replace these sample slides. Keep class="slide" and data-sec. -->
  <section class="slide dark" data-sec="{{T:sec_start}}">
    <div class="eyebrow">{{T:s1_eyebrow}}</div>
    <h1>{{T:s1_h1}}</h1>
    <p style="margin-top:3vh">{{T:s1_p}}</p>
  </section>

  <section class="slide" data-sec="{{T:sec_explain}}">
    <div class="eyebrow">{{T:s2_eyebrow}}</div>
    <h2>{{T:s2_h2}}</h2>
    <div class="grid">
      <div class="card"><strong>1</strong><span>{{T:card_1}}</span></div>
      <div class="card"><strong>48 px</strong><span>{{T:card_2}}</span></div>
      <div class="card"><strong>0</strong><span>{{T:card_3}}</span></div>
    </div>
  </section>

  <section class="slide dark" data-sec="{{T:sec_end}}">
    <div class="eyebrow">{{T:s3_eyebrow}}</div>
    <h2>{{T:s3_h2}}</h2>
    <p>{{T:s3_p}}</p>
  </section>
</main>

<nav id="controls" aria-label="{{T:controls_label}}">
  <button class="control-btn" id="nprev" type="button" aria-label="{{T:prev}}" title="{{T:prev}}">
    <span class="control-icon" aria-hidden="true">←</span>
  </button>
  <div id="counter" aria-live="polite">1 / 1</div>
  <button class="control-btn" id="nnext" type="button" aria-label="{{T:next}}" title="{{T:next}}">
    <span class="control-icon" aria-hidden="true">→</span>
  </button>
  <button class="control-btn" id="fullscreen" type="button" aria-label="{{T:fs_enter}}" title="{{T:fs_enter}}" aria-pressed="false">
    <span class="control-icon" id="fullscreen-icon" aria-hidden="true">⛶</span>
    <span id="fullscreen-label">{{T:fs_label}}</span>
  </button>
</nav>
<div id="progress"><i></i></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
  var slides = Array.prototype.slice.call(document.querySelectorAll('.slide'));
  var cur = 0;
  var prevButton = document.getElementById('nprev');
  var nextButton = document.getElementById('nnext');
  var fullscreenButton = document.getElementById('fullscreen');
  var fullscreenLabel = document.getElementById('fullscreen-label');
  var fullscreenIcon = document.getElementById('fullscreen-icon');
  var toast = document.getElementById('toast');
  var toastTimer = null;

  function notify(message){
    toast.textContent = message;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toast.classList.remove('show'); }, 4200);
  }
  function fullscreenElement(){
    return document.fullscreenElement || document.webkitFullscreenElement || null;
  }
  function fullscreenRequest(){
    var root = document.documentElement;
    return root.requestFullscreen || root.webkitRequestFullscreen || null;
  }
  function updateFullscreenControl(){
    var active = !!fullscreenElement();
    fullscreenButton.setAttribute('aria-pressed', active ? 'true' : 'false');
    fullscreenButton.setAttribute('aria-label', active ? '{{T:fs_exit}}' : '{{T:fs_enter}}');
    fullscreenButton.title = active ? '{{T:fs_exit}}' : '{{T:fs_enter}}';
    fullscreenLabel.textContent = active ? '{{T:fs_exit_short}}' : '{{T:fs_label}}';
    fullscreenIcon.textContent = active ? '×' : '⛶';
  }
  function toggleFullscreen(){
    if(fullscreenElement()){
      var exit = document.exitFullscreen || document.webkitExitFullscreen;
      if(exit) exit.call(document);
      return;
    }
    var request = fullscreenRequest();
    if(!request){
      notify('{{T:msg_unsupported}}');
      return;
    }
    try{
      var result = request.call(document.documentElement);
      if(result && result.catch){
        result.catch(function(){ notify('{{T:msg_refused}}'); });
      }
    }catch(err){
      notify('{{T:msg_refused}}');
    }
  }

  var railnav = document.getElementById('railnav');
  var sections = [], seen = {};
  slides.forEach(function(slide,index){
    var name = slide.dataset.sec || '{{T:default_section}}';
    if(!(name in seen)){
      seen[name] = sections.length;
      sections.push({name:name,first:index,slides:[]});
    }
    sections[seen[name]].slides.push(index);
  });
  sections.forEach(function(section){
    var item = document.createElement('div');
    item.className = 'rail-sec';
    item.innerHTML = '<div class="tick"></div><div class="label"></div>';
    item.querySelector('.label').textContent = section.name;
    item.onclick = function(){ show(section.first); };
    railnav.appendChild(item);
  });
  var railItems = Array.prototype.slice.call(railnav.children);

  function show(index){
    index = Math.max(0,Math.min(slides.length-1,index));
    cur = index;
    slides.forEach(function(slide,i){
      slide.classList.toggle('active',i===index);
      slide.classList.toggle('prev',i<index);
    });
    document.body.classList.toggle('on-dark',slides[index].classList.contains('dark'));
    var activeSection = -1;
    sections.forEach(function(section,i){
      if(section.slides.indexOf(index)!==-1) activeSection=i;
    });
    railItems.forEach(function(item,i){ item.classList.toggle('on',i===activeSection); });
    document.getElementById('counter').textContent = (index+1)+' / '+slides.length;
    prevButton.disabled = index===0;
    nextButton.disabled = index===slides.length-1;
    document.querySelector('#progress i').style.width =
      (slides.length<2 ? 100 : index/(slides.length-1)*100)+'%';
    if(location.hash!=='#s'+(index+1)) history.replaceState(null,'','#s'+(index+1));
  }
  function step(delta){ show(cur+delta); }

  prevButton.onclick = function(){ step(-1); };
  nextButton.onclick = function(){ step(1); };
  fullscreenButton.onclick = toggleFullscreen;
  document.addEventListener('fullscreenchange',updateFullscreenControl);
  document.addEventListener('webkitfullscreenchange',updateFullscreenControl);

  document.addEventListener('keydown',function(event){
    switch(event.key){
      case 'ArrowRight': case 'PageDown': case ' ': step(1); event.preventDefault(); break;
      case 'ArrowLeft': case 'PageUp': step(-1); event.preventDefault(); break;
      case 'Home': show(0); break;
      case 'End': show(slides.length-1); break;
      case 'f': case 'F': toggleFullscreen(); break;
    }
  });

  var touchX = null;
  document.addEventListener('touchstart',function(event){ touchX = event.touches[0].clientX; },{passive:true});
  document.addEventListener('touchend',function(event){
    if(touchX===null) return;
    var delta = event.changedTouches[0].clientX-touchX;
    if(Math.abs(delta)>60) step(delta<0 ? 1 : -1);
    touchX=null;
  },{passive:true});

  var start = parseInt((location.hash.match(/^#s(\d+)$/)||[])[1],10);
  updateFullscreenControl();
  show(isNaN(start) ? 0 : start-1);
})();
</script>
</body>
</html>
