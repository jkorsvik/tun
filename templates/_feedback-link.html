<p style="margin:0;padding:0 1.5rem 1.5rem;font-size:.875rem"><a id="tun-feedback" href="{{FEEDBACK_HREF}}" style="color:inherit;display:inline-flex;align-items:center;min-height:2.75rem;padding:0 .5rem;margin-left:-.5rem">{{T:link}}</a></p><script>
(function () {
  "use strict";
  // Filled in by tools/feedback_link.py. The static href above already works with
  // JavaScript off; this script only swaps in a richer snapshot when it can run.
  var C = {{FEEDBACK_CONFIG}};
  var errors = 0;
  window.addEventListener("error", function () { errors++; });
  window.addEventListener("unhandledrejection", function () { errors++; });

  function view() {
    var h = location.hostname, where =
      location.protocol === "file:" ? "{{T:where_file}}" :
      /-my\.sharepoint\.com$/i.test(h) ? "OneDrive" :
      /\.sharepoint\.com$/i.test(h) ? "SharePoint" : "{{T:where_unknown}}";
    var framed;
    try { framed = window.top !== window.self; } catch (e) { framed = true; }
    return framed ? where + "{{T:in_frame}}" : where;
  }

  function href() {
    var live = [
      ["{{T:f_protocol}}", location.protocol.replace(":", "")],
      ["{{T:f_view}}", view()],
      ["{{T:f_browser}}", navigator.userAgent],
      ["{{T:f_window}}", innerWidth + "x" + innerHeight + " @" + (window.devicePixelRatio || 1) + "x"],
      ["JavaScript", "{{T:yes}}"],
      ["{{T:f_errors}}", String(errors)]
    ];
    var body = C.head + live.map(function (f) { return f[0] + ": " + f[1]; }).join("\n");
    if (C.crlf) body = body.replace(/\n/g, "\r\n");
    return C.base + (C.base.indexOf("?") < 0 ? "?" : "&") + C.keys[0] + "=" + encodeURIComponent(C.subject)
      + "&" + C.keys[1] + "=" + encodeURIComponent(body);
  }

  var a = document.getElementById("tun-feedback");
  if (!a) return;
  // Rebuilt on every approach, so the error count is the one at the moment of use.
  ["focus", "mouseenter", "pointerdown", "click"].forEach(function (ev) {
    a.addEventListener(ev, function () { a.href = href(); });
  });
  a.href = href();
})();
</script>
