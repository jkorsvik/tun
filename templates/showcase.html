<html lang="{{T:html_lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{TITLE}}</title>
<!--
  {{TITLE}}
  PROVENANCE  (do not delete - this is how output gets traced back)
    Source data : {{SOURCE_DESCRIPTION}}
    Extracted   : {{EXTRACT_TIMESTAMP}}
    Built       : {{BUILD_TIMESTAMP}}
    Requested by: {{REQUESTED_BY}}
    Made with   : Tún - tun.community
    Records     : {{ROWS_INLINED}}

  Every picture here is a photograph of a real built example, taken by a browser from a
  file:// URL at build time. Every example is also carried whole inside this file and runs
  when a card is opened, so the document is usable and not only readable. Nothing is loaded
  from a network, and the reader can switch language in the page.

  This is a self-contained artefact: no server, no CDN, no licence required to view it.
-->
<style>
  :root {
    --paper: #ffffff;
    --ink: #1b2a4a;
    --ink-soft: #4a5670;
    --line: #d8dde8;
    --tint: #eef2f8;
    --accent: #2f5d9e;
    --accent-ink: #ffffff;
    --radius: 0.75rem;
    --shadow: 0 1px 2px rgb(27 42 74 / 8%), 0 8px 24px rgb(27 42 74 / 6%);
  }
  @media screen and (prefers-color-scheme: dark) {
    :root {
      --paper: #101725;
      --ink: #eef2f8;
      --ink-soft: #a9b4c8;
      --line: #2a3650;
      --tint: #182234;
      --accent: #7fa8e0;
      --accent-ink: #101725;
      --shadow: 0 1px 2px rgb(0 0 0 / 30%), 0 8px 24px rgb(0 0 0 / 24%);
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font: 1rem/1.5 "Tun", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  }
  .wrap { width: 100%; max-width: 78rem; margin: 0 auto; padding: 1.5rem; }
  header.top { border-bottom: 1px solid var(--line); background: var(--tint); }
  .head-row { display: flex; flex-wrap: wrap; gap: 1rem; align-items: flex-start; justify-content: space-between; }
  h1 { font-size: 1.75rem; line-height: 1.2; margin: 0 0 0.5rem; }
  .sub { margin: 0; color: var(--ink-soft); max-width: 46rem; }
  .lang { display: flex; gap: 0.25rem; border: 1px solid var(--line); border-radius: 999px; padding: 0.25rem; background: var(--paper); }
  .lang button {
    min-height: 2.75rem; padding: 0 0.875rem; font: inherit; font-weight: 600;
    color: var(--ink-soft); background: transparent; border: 0; border-radius: 999px; cursor: pointer;
  }
  .lang button.on { color: var(--accent-ink); background: var(--accent); }
  .lang button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .chips { display: flex; flex-wrap: wrap; gap: 0.5rem; margin: 1rem 0 0; padding: 0; list-style: none; }
  .chips li {
    background: var(--paper); border: 1px solid var(--line); border-radius: 999px;
    padding: 0.25rem 0.75rem; font-size: 0.875rem; color: var(--ink-soft);
  }
  .chips b { color: var(--ink); font-variant-numeric: tabular-nums; }
  .finder { display: flex; flex-wrap: wrap; gap: 0.75rem; align-items: center; margin: 1.5rem 0 1rem; }
  .finder label { font-weight: 600; font-size: 0.875rem; }
  .finder input {
    flex: 1 1 18rem; min-height: 2.75rem; font: inherit; color: var(--ink);
    background: var(--paper); border: 1px solid var(--line); border-radius: 0.5rem;
    padding: 0.5rem 0.75rem; appearance: none;
  }
  .finder input:focus-visible { outline: 3px solid var(--accent); outline-offset: 1px; }
  .count { font-size: 0.875rem; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
  .grid { display: grid; gap: 1rem; grid-template-columns: 1fr; margin: 0 0 3rem; padding: 0; list-style: none; }
  @media (min-width: 40rem) { .grid { grid-template-columns: repeat(2, 1fr); } }
  @media (min-width: 64rem) { .grid { grid-template-columns: repeat(3, 1fr); } }
  .card {
    display: flex; flex-direction: column; background: var(--paper);
    border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden;
    box-shadow: var(--shadow);
  }
  .card[hidden] { display: none; }
  .shot {
    display: block; width: 100%; min-height: 2.75rem; padding: 0; border: 0;
    border-bottom: 1px solid var(--line); background: var(--tint); cursor: zoom-in;
  }
  .shot img { display: block; width: 100%; height: auto; }
  .body { padding: 0.875rem 1rem 1rem; display: flex; flex-direction: column; gap: 0.5rem; }
  .body h2 { font-size: 1rem; line-height: 1.3; margin: 0; }
  .body h2 span { color: var(--ink-soft); font-weight: 400; font-variant-numeric: tabular-nums; }
  .body p { margin: 0; font-size: 0.875rem; color: var(--ink-soft); }
  .kind { font-size: 0.875rem; letter-spacing: 0.03em; text-transform: uppercase; color: var(--accent); font-weight: 700; }
  details { font-size: 0.875rem; }
  details summary { cursor: pointer; color: var(--ink-soft); min-height: 2.75rem; display: flex; align-items: center; }
  details code { display: block; white-space: pre-wrap; word-break: break-word; background: var(--tint); border-radius: 0.375rem; padding: 0.5rem; margin-top: 0.25rem; font-size: 0.875rem; }
  .things { border-top: 1px solid var(--line); padding-top: 2.5rem; }
  .things-h { font-size: 1.25rem; line-height: 1.3; margin: 0 0 1rem; }
  .cols { display: grid; gap: 1.5rem; grid-template-columns: 1fr; }
  @media (min-width: 40rem) { .cols { grid-template-columns: repeat(2, 1fr); } }
  @media (min-width: 64rem) { .cols { grid-template-columns: repeat(4, 1fr); } }
  .cols h3 { font-size: 0.875rem; letter-spacing: 0.03em; text-transform: uppercase; color: var(--accent); margin: 0 0 0.5rem; }
  .cols ul {
    margin: 0; padding: 0 0.25rem 0 0; list-style: none; font-size: 0.875rem;
    color: var(--ink-soft); max-height: 20rem; overflow: auto; overscroll-behavior: contain;
  }
  .cols li { padding: 0.25rem 0; border-bottom: 1px solid var(--line); word-break: break-word; }
  footer { border-top: 1px solid var(--line); padding: 1.5rem 0 3rem; color: var(--ink-soft); font-size: 0.875rem; }
  footer p { margin: 0 0 0.5rem; }
  dialog {
    width: min(96vw, 78rem); max-height: 94vh; padding: 0; border: 1px solid var(--line);
    border-radius: var(--radius); background: var(--paper); color: var(--ink);
  }
  dialog::backdrop { background: rgb(16 23 37 / 72%); }
  dialog iframe { display: block; width: 100%; height: min(82vh, 48rem); border: 0; background: #fff; }
  /* The bar is the only way through the collection once a card is open, so it holds the
     position as well as the controls: "12 av 49" answers "where am I" without closing. */
  dialog .bar { display: flex; align-items: center; gap: .75rem; padding: .5rem .75rem; }
  dialog .bar p { flex: 1; margin: 0; font-size: .875rem; line-height: 1.5; color: var(--muted); }
  dialog .bar button { font: inherit; font-size: .875rem; line-height: 1.5; padding: .5rem .875rem;
    min-height: 2.75rem; border: 1px solid var(--line); border-radius: .5rem;
    background: var(--panel); color: var(--ink); cursor: pointer; }
  dialog .bar button:hover:not(:disabled) { border-color: var(--brand); }
  dialog .bar button:disabled { opacity: .45; cursor: default; }
  dialog .bar #shut { margin-left: auto; }
  .close { position: sticky; top: 0; display: flex; justify-content: flex-end; padding: 0.5rem; background: var(--paper); }
  .close button {
    min-height: 2.75rem; min-width: 2.75rem; font: inherit; font-weight: 600;
    color: var(--accent-ink); background: var(--accent);
    border: 0; border-radius: 0.5rem; cursor: pointer; padding: 0 1rem;
  }
  .none { padding: 2rem 0; color: var(--ink-soft); }
  @media print {
    .finder, .close, .lang { display: none; }
    .card { break-inside: avoid; }
  }
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="head-row">
      <div>
        <h1>{{TITLE}}</h1>
        <p class="sub" data-i18n="footer_how">{{T:footer_how}}</p>
      </div>
      <div class="lang" role="group" aria-label="{{T:lang_label}}">
        <button type="button" data-lang="nb">{{T:lang_nb}}</button>
        <button type="button" data-lang="en">{{T:lang_en}}</button>
      </div>
    </div>
    <ul class="chips">{{CHIPS}}</ul>
  </div>
</header>

<main class="wrap">
  <div class="finder">
    <label for="q" data-i18n="filter_label">{{T:filter_label}}</label>
    <input id="q" type="search" autocomplete="off" placeholder="{{T:filter_placeholder}}">
    <span class="count" id="count" data-i18n="count_all" role="status" aria-live="polite">{{T:count_all}}</span>
  </div>
  <ul class="grid" id="grid">{{CARDS}}</ul>
  <p class="none" id="none" data-i18n="no_match" hidden>{{T:no_match}}</p>
</main>

<section class="wrap things">
  <h2 class="things-h" data-i18n="things_heading">{{T:things_heading}}</h2>
  <div class="cols">{{THINGS}}</div>
</section>

<footer>
  <div class="wrap">
    <p data-i18n="footer_how">{{T:footer_how}}</p>
    <p data-i18n="footer_trace">{{T:footer_trace}}</p>
    <p data-i18n="live_note">{{T:live_note}}</p>
  </div>
</footer>

<dialog id="viewer" aria-label="{{T:viewer_label}}">
  <div class="bar">
    <button type="button" id="prev" aria-label="{{T:prev}}">
      <span aria-hidden="true">&lsaquo;</span> <span data-i18n="prev">{{T:prev}}</span>
    </button>
    <p id="pos" aria-live="polite"></p>
    <button type="button" id="next" aria-label="{{T:next}}">
      <span data-i18n="next">{{T:next}}</span> <span aria-hidden="true">&rsaquo;</span>
    </button>
    <button type="button" id="shut" data-i18n="close">{{T:close}}</button>
  </div>
  <iframe id="big" title="{{T:viewer_label}}" referrerpolicy="no-referrer"
          sandbox="allow-scripts allow-popups allow-downloads"></iframe>
</dialog>

<script>
(function () {
  "use strict";
  var T = {{LANG_JSON}};
  var lang = {{START_LANG}};
  var q = document.getElementById("q");
  var cards = Array.prototype.slice.call(document.querySelectorAll("#grid .card"));
  var count = document.getElementById("count");
  var none = document.getElementById("none");
  var total = cards.length;
  var one = {{COUNT_ONE_JS}};
  var many = {{COUNT_MANY_JS}};

  function apply() {
    var term = q.value.trim().toLowerCase();
    var shown = 0;
    cards.forEach(function (card) {
      var hay = card.getAttribute("data-search") || "";
      var hit = !term || hay.indexOf(term) !== -1;
      card.hidden = !hit;
      if (hit) { shown += 1; }
    });
    none.hidden = shown !== 0;
    count.textContent = (shown === total)
      ? many.replace("{n}", String(shown))
      : one.replace("{n}", String(shown)).replace("{t}", String(total));
  }

  function setLang(next) {
    if (!T[next]) { return; }
    lang = next;
    document.documentElement.lang = T[next].html_lang;
    Array.prototype.forEach.call(document.querySelectorAll("[data-i18n]"), function (el) {
      var key = el.getAttribute("data-i18n");
      if (T[next][key] !== undefined) { el.textContent = T[next][key]; }
    });
    q.placeholder = T[next].filter_placeholder;
    // The position line is built from strings, so a language switch while a card is open
    // must rebuild it; everything else on it is already a data-i18n element.
    if (viewer && viewer.open) { show(at); }
    big.title = T[next].viewer_label;
    one = T[next].count_one;
    many = T[next].count_many;
    Array.prototype.forEach.call(document.querySelectorAll(".lang button"), function (b) {
      var on = b.getAttribute("data-lang") === next;
      b.setAttribute("aria-pressed", on ? "true" : "false");
      if (on) { b.classList.add("on"); } else { b.classList.remove("on"); }
    });
    try {
      if (window.history && window.history.replaceState) {
        window.history.replaceState(null, "", "#" + next);
      }
    } catch (e) { /* opaque origin: the choice still applies, it just cannot be linked */ }
    apply();
  }

  q.addEventListener("input", apply);
  q.addEventListener("search", apply);

  var viewer = document.getElementById("viewer");
  var big = document.getElementById("big");
  var shut = document.getElementById("shut");
  var prev = document.getElementById("prev");
  var next = document.getElementById("next");
  var pos = document.getElementById("pos");
  var order = [];   // only the cards a reader can actually reach: what the filter left
  var at = 0;
  var opener = null;

  function decode(b64) {
    var bin = atob(b64);
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i += 1) { bytes[i] = bin.charCodeAt(i); }
    return new TextDecoder("utf-8").decode(bytes);
  }

  function visibleCards() {
    return Array.prototype.filter.call(document.querySelectorAll("#grid .card"), function (c) {
      return !c.hidden && c.offsetParent !== null;
    });
  }

  function titleOf(card) {
    var h = card ? card.querySelector("h2") : null;
    return h ? h.textContent.trim() : "";
  }

  function show(i) {
    if (!order.length) { return; }
    at = Math.max(0, Math.min(order.length - 1, i));
    var card = order[at];
    var payload = card.getAttribute("data-live") || "";
    big.srcdoc = payload ? decode(payload) : "";
    // Two bare numbers side by side read as one number split in two. The second one is the
    // example's own number, carried on the card, so the bar names it.
    pos.textContent = String(T[lang].pos)
      .replace("{i}", String(at + 1)).replace("{n}", String(order.length))
      .replace("{e}", card.getAttribute("data-num") || "")
      + (titleOf(card) ? " \u00b7 " + titleOf(card) : "");
    prev.disabled = at === 0;
    next.disabled = at === order.length - 1;
  }

  function openCard(card, btn) {
    order = visibleCards();
    if (!order.length) { return; }
    opener = btn || null;
    if (typeof viewer.showModal === "function") { viewer.showModal(); }
    show(order.indexOf(card));
    // Give the frame the keyboard. A deck inside it advances on an arrow key, but only
    // once that key is delivered to its own document, and a key pressed with the focus
    // still on the page behind it goes nowhere. A reader would click first; this does it
    // for them.
    try { big.focus(); } catch (e) { /* focus is a courtesy, not the feature */ }
  }

  Array.prototype.forEach.call(document.querySelectorAll(".shot"), function (btn) {
    btn.addEventListener("click", function () {
      var card = btn.closest(".card");
      if (card) { openCard(card, btn); }
    });
  });

  prev.addEventListener("click", function () { show(at - 1); prev.focus(); });
  next.addEventListener("click", function () { show(at + 1); next.focus(); });
  shut.addEventListener("click", function () { viewer.close(); });
  viewer.addEventListener("close", function () {
    big.srcdoc = "";
    // Hand the keyboard back to the card the reader came from. Without this, focus lands
    // on the body and a keyboard reader starts over at the top of a very long page.
    if (opener) { try { opener.focus(); } catch (e) { /* the card may have been filtered out */ } }
  });
  viewer.addEventListener("click", function (e) { if (e.target === viewer) { viewer.close(); } });
  // Left and right walk the collection while the focus is in the bar. Once the frame holds
  // the focus, those keys belong to the artefact, which is why the buttons exist.
  viewer.addEventListener("keydown", function (e) {
    if (e.key === "ArrowRight" || e.key === "PageDown") { e.preventDefault(); show(at + 1); next.focus(); }
    else if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); show(at - 1); prev.focus(); }
  });
  // Escape has to work from the page as well as from the frame. Once the frame holds the
  // keyboard an Escape pressed there belongs to the artefact, so the page cannot see it; in
  // that case the Close button and the backdrop are the way out, and both are always there.
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && viewer.open) { viewer.close(); }
  });

  Array.prototype.forEach.call(document.querySelectorAll(".lang button"), function (b) {
    b.addEventListener("click", function () { setLang(b.getAttribute("data-lang")); });
  });

  var fromHash = (window.location.hash || "").replace("#", "");
  setLang(T[fromHash] ? fromHash : lang);
})();
</script>
</body>
</html>
