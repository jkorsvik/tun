<html lang="{{T:html_lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{TITLE}}</title>
<!--
  {{TITLE}}
  PROVENANCE  (do not delete — this is how output gets traced back)
    Source data : {{SOURCE_DESCRIPTION}}
    Extracted   : {{EXTRACT_TIMESTAMP}}
    Built       : {{BUILD_TIMESTAMP}}
    Requested by: {{REQUESTED_BY}}
    Made with   : Tún — tun.community
    Answers     : {{ANSWERS_INLINED}} inlined, long format {segment…, question, answer}

  This is a self-contained artefact: no server, no CDN dependency, no licence
  required to view. It works offline, from a OneDrive/SharePoint-synced folder.

  What this file does NOT contain, on purpose:
    * free text. No threshold can anonymise a sentence, so it is dropped at build
      time and the builder refuses a column that looks like an answer nobody chose.
    * anything that identifies a respondent. The builder never reads an id column;
      it counts answers, not people.

  Privacy rule applied in this file: a cell with fewer than {{MIN_CELL}} answers is
  hidden, both per question and per option (k-anonymity). See the note under the title.

  ⚠ SECURITY: all content below is readable by anyone who can open this file. If
     different viewers must see different answers, this file must not exist as one
     shared copy — split by audience and folder before generating it (AGENTS.md
     rule 1: the boundary is the folder, not a filter inside the file).

  The static cards below are the no-JS view: the whole picture, drawn by the
  builder. The script only re-renders them when a filter changes.
-->
<style>
/* The colour tokens are inlined by the builder from tools/tokens/: one seam shared with
   every other artefact, which is also how this page follows the operating system's dark
   setting with no script. Add no hex of your own here.

   A five-colour --s1 to --s5 series was declared here and painted nowhere: no rule and no
   line in the builder referenced it. It is gone rather than themed, for the same reason the
   timeline lost --bar-done and --bar-late: a colour nobody paints is a claim about support
   the page does not make. */
{{TOKEN_CSS}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Eksempel AS","Segoe UI",system-ui,-apple-system,sans-serif;font-size:1rem;line-height:1.5}
header{background:var(--brand-dark);color:var(--on-brand);padding:1.25rem 1.5rem}
header .in{max-width:78rem;margin:0 auto}
h1{margin:0;font-size:1.375rem;line-height:1.75rem;font-weight:600}
header .sub{margin:.25rem 0 0;font-size:.875rem;line-height:1.25rem;opacity:.9}
main{max-width:78rem;margin:0 auto;padding:1.5rem}
.controls{display:flex;flex-wrap:wrap;gap:.75rem 1rem;align-items:flex-end;
  background:var(--panel);border:1px solid var(--line);border-radius:.5rem;padding:1rem}
.controls .field{display:flex;flex-direction:column;gap:.25rem;min-width:11rem}
.controls label{font-size:.875rem;line-height:1.25rem;color:var(--muted);font-weight:600}
.controls select{font:inherit;font-size:.875rem;min-height:2.75rem;padding:.5rem 2rem .5rem .625rem;
  border:1px solid var(--line);border-radius:.25rem;background:var(--panel);color:var(--ink);
  /* Safari draws a native select at its own height and ignores min-height, which cost
     every iPhone a 22 px target. appearance:none gives the box back to the stylesheet,
     and the chevron is drawn below instead. */
  -webkit-appearance:none;appearance:none;
  background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 8'%3E%3Cpath d='M1 1.5 6 6.5 11 1.5' fill='none' stroke='%2300343e' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:right .5rem center;background-size:.75rem .5rem}
.controls button{font:inherit;font-size:.875rem;font-weight:600;min-height:2.75rem;padding:.5rem 1rem;
  border:1px solid var(--brand);border-radius:.25rem;background:var(--panel);color:var(--brand);cursor:pointer}
.controls button:hover{background:var(--brand-soft)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(13rem,100%),1fr));
  gap:.75rem;margin:1rem 0 0;padding:0;list-style:none}
.kpis li{background:var(--panel);border:1px solid var(--line);border-left:.25rem solid var(--brand);
  border-radius:.375rem;padding:.75rem 1rem}
.kpis .label{display:block;font-size:.875rem;line-height:1.25rem;color:var(--muted)}
.kpis .num{display:block;font-size:1.75rem;line-height:2rem;font-weight:700;
  font-variant-numeric:tabular-nums}
.note{margin:1rem 0 0;padding:.75rem 1rem;background:var(--brand-soft);border-radius:.375rem;
  font-size:.875rem;line-height:1.5;max-width:78rem}
.q{margin:1.25rem 0 0;background:var(--panel);border:1px solid var(--line);border-radius:.5rem;
  padding:1rem 1.25rem 1.25rem}
.q h2{margin:0;font-size:1.0625rem;line-height:1.5rem;font-weight:600}
.q .n{margin:.25rem 0 .75rem;font-size:.875rem;line-height:1.25rem;color:var(--muted);
  font-variant-numeric:tabular-nums}
.stack{display:flex;height:1.75rem;border-radius:.25rem;overflow:hidden;background:var(--rule)}
.stack span{display:block;height:100%}
.rows{margin:.5rem 0 0;padding:0;list-style:none;display:grid;gap:.25rem}
.rows li{display:grid;grid-template-columns:1fr auto 5.5rem;gap:.75rem;align-items:center;
  font-size:.875rem;line-height:1.5;padding:.125rem 0;border-bottom:1px solid var(--rule)}
.rows li:last-child{border-bottom:0}
.rows .k{display:flex;align-items:center;gap:.5rem;min-width:0}
.rows .sw{flex:none;width:.875rem;height:.875rem;border-radius:.1875rem}
.rows .v,.rows .p{text-align:right;font-variant-numeric:tabular-nums}
.rows .p{color:var(--muted)}
.x{margin:1.5rem 0 0;padding:1rem 1.25rem;border:1px solid var(--rule);border-radius:.5rem}
.x h2{margin:0 0 .25rem;font-size:1rem}
.scroll{overflow-x:auto}
.x table{border-collapse:collapse;width:100%;font-size:.875rem}
.x th,.x td{padding:.375rem .5rem;text-align:right;border-bottom:1px solid var(--rule);white-space:nowrap}
.x thead th:nth-child(1),.x tbody th{text-align:left}
.x thead th{font-weight:600}
.x td.t,.x tfoot th,.x tfoot td{font-weight:600;background:var(--rule)}
.x td.h{color:var(--muted)}
.rows .hidden{color:var(--muted);font-style:italic}
.supp{padding:1rem 0 0;color:var(--muted);font-size:.875rem;line-height:1.5}
.supp strong{color:var(--ink);display:block}
footer{max-width:78rem;margin:2rem auto 0;padding:1rem 1.5rem 2rem;color:var(--muted);
  font-size:.875rem;line-height:1.5;border-top:1px solid var(--line)}
footer a{color:var(--brand)}
@media (max-width:30rem){
  .rows li{grid-template-columns:1fr auto;gap:.25rem .75rem}
  .rows .p{grid-column:2;text-align:right}
}
/* Dark, for a reader whose operating system asks for it and who has chosen no theme of
   their own. The declarations above come from theme-dark.css; the only place this page picks
   a slot by its LIGHT role is the header band, which fills with --brand-dark and writes
   --on-brand on it: two darks in dark, 1.39:1. It uses the pair the theme defines for a
   brand fill. */
@media screen and (prefers-color-scheme: dark){
  :root:not([data-theme]) header{background:var(--brand);color:var(--on-brand)}
}
@media print{
  body{background:#fff}
  header{background:#fff;color:var(--ink);border-bottom:1px solid var(--line)}
  .controls,.note{display:none}
  .q{break-inside:avoid;border:0;border-bottom:1px solid var(--line);border-radius:0}
}
</style>
</head>
<body>
<script>document.documentElement.className += " js"</script>
<header><div class="in">
  <h1>{{TITLE}}</h1>
  <p class="sub">{{SOURCE_DESCRIPTION}}</p>
</div></header>
<main>
  <form class="controls" id="controls" hidden>
    {{FILTER_FIELDS}}
    <div class="field"><label>&nbsp;</label><button type="reset" id="reset">{{T:reset}}</button></div>
  </form>
  <ul class="kpis" id="kpis">{{KPI_CARDS}}</ul>
  <p class="note">{{T:suppression_note}}</p>
  <div id="questions">{{QUESTION_CARDS}}</div>
  <p class="note" id="cross-note" hidden>{{T:cross_filtered}}</p>
  <div id="cross">{{CROSS_SECTIONS}}</div>
</main>
<footer>
  {{T:footer_a}} &middot; {{T:footer_b}} &middot;
  {{T:footer_built}} {{BUILD_TIMESTAMP}} {{T:from}} {{SOURCE_DESCRIPTION}}.<br>
  <noscript>{{T:suppression_note}}</noscript>
</footer>{{FEEDBACK_BLOCK}}
<script>
/* Survey state: the answers, long format, one entry per answer given. */
var SURVEY = {{SURVEY_DATA}};

(function () {
  var form = document.getElementById("controls");
  var box = document.getElementById("questions");
  var kpis = document.getElementById("kpis");
  if (!SURVEY.rows.length) return;
  form.hidden = false;

  function chosen() {
    var out = [];
    for (var i = 0; i < SURVEY.segments.length; i++) {
      var el = form.elements["s" + i];
      out.push(el && el.value !== "" ? Number(el.value) : -1);
    }
    return out;
  }

  function pass(row, pick) {
    for (var i = 0; i < pick.length; i++) {
      if (pick[i] !== -1 && row[2 + i] !== pick[i]) return false;
    }
    return true;
  }

  /* Count one question. Returns per-option counts and the total, and nothing else:
     the suppression rule is applied where the numbers are printed. */
  function count(qi, pick) {
    var counts = new Array(SURVEY.options[qi].length).fill(0), n = 0;
    for (var r = 0; r < SURVEY.rows.length; r++) {
      var row = SURVEY.rows[r];
      if (row[0] !== qi || !pass(row, pick)) continue;
      counts[row[1]] += 1; n += 1;
    }
    return {counts: counts, n: n};
  }

  function esc(s) {
    return String(s).replace(/[<>&"]/g, function (m) {
      return {"<": "&lt;", ">": "&gt;", "&": "&amp;", '"': "&quot;"}[m];
    });
  }
  var num = new Intl.NumberFormat("{{T:num_locale}}");
  function pct(v, of) { return (of ? v / of * 100 : 0).toFixed(1).replace(".", "{{T:dec}}") + " %"; }

  /* The same markup the builder painted, so a reader who filters sees one design. */
  function card(qi, res) {
    var opts = SURVEY.options[qi], html = "";
    if (res.n < {{MIN_CELL}}) {
      return '<section class="q"><h2>' + esc(SURVEY.questions[qi]) + '</h2>'
        + '<div class="supp"><strong>{{T:suppressed_head}}</strong>{{T:suppressed_body}}</div></section>';
    }
    var stack = "";
    for (var o = 0; o < opts.length; o++) {
      if (!res.counts[o]) continue;
      stack += '<span style="width:' + (res.counts[o] / res.n * 100).toFixed(2) + '%;background:var(--cat-'
        + ((o % 5) + 1) + ')"></span>';
    }
    for (o = 0; o < opts.length; o++) {
      var c = res.counts[o];
      var shown = c >= {{MIN_CELL}};
      html += '<li><span class="k"><i class="sw" style="background:var(--cat-' + ((o % 5) + 1) + ')"></i>'
        + esc(opts[o]) + '</span>'
        + '<span class="v">' + (shown ? num.format(c) : '<i class="hidden">{{T:suppressed_head}}</i>') + '</span>'
        + '<span class="p">' + (shown ? pct(c, res.n) : "") + '</span></li>';
    }
    return '<section class="q"><h2>' + esc(SURVEY.questions[qi]) + '</h2>'
      + '<p class="n">' + num.format(res.n) + ' {{T:answered}}</p>'
      + '<div class="stack" aria-hidden="true">' + stack + '</div>'
      + '<ul class="rows">' + html + '</ul></section>';
  }

  function render() {
    var pick = chosen(), html = "", answers = 0, hidden = 0;
    for (var qi = 0; qi < SURVEY.questions.length; qi++) {
      var res = count(qi, pick);
      answers += res.n;
      if (res.n && res.n < {{MIN_CELL}}) { hidden += 1; }
      else {
        for (var o = 0; o < res.counts.length; o++) {
          if (res.counts[o] && res.counts[o] < {{MIN_CELL}}) hidden += 1;
        }
      }
      html += res.n ? card(qi, res) : "";
    }
    box.innerHTML = html || '<p class="q">' + "{{T:no_rows}}" + '</p>';
    kpis.innerHTML = '<li><span class="label">{{T:kpi_answers}}</span><span class="num">'
      + num.format(answers) + '</span></li>'
      + '<li><span class="label">{{T:kpi_questions}}</span><span class="num">'
      + SURVEY.questions.length + '</span></li>'
      + '<li><span class="label">{{T:kpi_suppressed}}</span><span class="num">'
      + num.format(hidden) + '</span></li>';
  }

  /* The cross-tabs are painted by the builder over the whole selection and are not
     recomputed here: one implementation of that rule is the point. Say so instead of
     showing a number that no longer matches the filter above it. */
  var cross = document.getElementById("cross");
  var crossNote = document.getElementById("cross-note");
  function crossState() {
    if (!cross) return;
    var on = chosen().some(function (v) { return v !== -1; });
    for (var i = 0; i < cross.children.length; i++) cross.children[i].hidden = on;
    if (crossNote) crossNote.hidden = !on || !cross.children.length;
  }

  form.addEventListener("change", function () { render(); crossState(); });
  form.addEventListener("reset", function () { setTimeout(function () { render(); crossState(); }, 0); });
})();
</script>
</body>
</html>
