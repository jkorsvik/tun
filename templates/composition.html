<html lang="{{T:html_lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{TITLE}}</title>
<!--
  {{TITLE}}
  PROVENANCE  (do not delete - this is how output gets traced back)
    Source data : {{SOURCE_DESCRIPTION}}
    Extracted   : {{EXTRACT_TIMESTAMP}}
    Built       : {{BUILD_TIMESTAMP}}
    Requested by: {{REQUESTED_BY}}
    Made with   : Tún - tun.community
    Rows        : {{ROWS_INLINED}} source rows, every one of them read

  This is a self-contained artefact: no server, no CDN dependency, no licence required to
  view. It works offline, from a OneDrive/SharePoint-synced folder.

  What this file is: one column per period, each split into the categories that make up its
  total, so the reader sees the mix. The period's total stands above its column, because a
  share is a ratio and a ratio hides the level it is a ratio of.

  What it is NOT: an attribution of cause, or a claim that the mix is what matters. A
  category can take a bigger share while its own figure falls, when the total fell faster;
  that divergence is named in the sentences beside the drawing, and the table carries the
  absolute figure beside every share so the reader can check it.

  There is no script in this file. A filter would re-lay the drawing, and the drawing is the
  claim being made.
-->
<style>
/* The colour tokens are inlined by the builder from tools/tokens/: one seam shared with
   every other artefact, which is also how this page follows the operating system's dark
   setting with no script. */
{{TOKEN_CSS}}
:root{
  /* The four categorical slots and the neutral rest band. They are template-local because a
     composition's ramp is a design decision, not a UI role: four brand values ordered dark to
     light so the stack reads as a ramp, with Fire Red deliberately out of the set, because a
     composition is not a verdict and red on an ordinary category reads as one. A dark theme
     cannot reuse the light ramp (dark blue on a dark panel is invisible), so the ramp flips
     to light-to-dark there and the ink assignment flips with it. */
  --s1:#1B2A4A;--s2:#2F5D9E;--s3:#6B3FA0;--s4:#8fb3ae;--srest:#dcdcdc;
  --cs-ink-a:#fff;--cs-ink-b:#0a0a0a;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Eksempel AS","Segoe UI",system-ui,-apple-system,sans-serif;font-size:1rem;line-height:1.5}
header{background:var(--brand-dark);color:var(--on-brand);padding:1.25rem 1.5rem}
header .in{max-width:86rem;margin:0 auto}
h1{margin:0;font-size:1.375rem;line-height:1.75rem;font-weight:600}
header .sub{margin:.25rem 0 0;font-size:.875rem;line-height:1.5;opacity:.9}
main{max-width:86rem;margin:0 auto;padding:1.5rem}
h2{font-size:1.125rem;line-height:1.5rem;margin:2rem 0 .5rem;font-weight:600}
.figure{margin:0;background:var(--panel);border:1px solid var(--line);border-radius:.5rem;
  padding:1rem;overflow:auto}
/* Never narrower than 1 unit = 1 px: the drawing's text is 14 units, and a
   scaled-down drawing is text under the floor. Below that the box pans. */
.figure svg{display:block;width:100%;height:auto;min-width:62.5rem}
.cs-grid{stroke:var(--rule);stroke-width:1}
.cs-base{stroke:var(--line);stroke-width:1}
.cs-tick{fill:var(--muted);font-size:14px}
.cs-axis{fill:var(--muted);font-size:14px}
.cs-total{fill:var(--ink);font-size:14px;font-weight:600}
.cs-period{fill:var(--ink);font-size:14px}
/* A share printed inside a band sits on that band's own fill, so the ink is chosen per slot
   from the fill's luminance: white on blue, Emerald and Fire Red, near-black on Summer
   Green, its tint and the neutral rest. */
.cs-share{font-size:14px;font-weight:600;fill:var(--cs-ink-a)}
/* On the text element itself: a share label is a sibling of the band it sits on, so no
   descendant selector from the band can reach it. */
.cs-ink-3,.cs-ink-4,.cs-ink-rest{fill:var(--cs-ink-b)}
.cs-1{fill:var(--s1);background:var(--s1)}
.cs-2{fill:var(--s2);background:var(--s2)}
.cs-3{fill:var(--s3);background:var(--s3)}
.cs-4{fill:var(--s4);background:var(--s4)}
.cs-rest{fill:var(--srest);background:var(--srest)}
.tag{display:inline-block;padding:0 .375rem;border-radius:.25rem;background:var(--brand-soft);
  color:var(--on-brand-soft);font-size:.875rem;line-height:1.5rem;vertical-align:.0625rem}
figcaption{margin:.75rem 0 0;font-size:.875rem;line-height:1.5;color:var(--muted)}
.moves{margin:1rem 0 0;padding-left:1.25rem;font-size:.9375rem;line-height:1.5}
.moves li{margin:.25rem 0}
.note{margin:.5rem 0 0;font-size:.875rem;line-height:1.5;color:var(--muted)}
table{width:100%;border-collapse:collapse;background:var(--panel);
  border:1px solid var(--line);border-radius:.5rem;font-size:.875rem;line-height:1.5}
caption{text-align:left;padding:0 0 .5rem;color:var(--muted)}
th,td{padding:.5rem .75rem;text-align:left;border-bottom:1px solid var(--line);
  vertical-align:top}
thead th{background:var(--brand-soft);color:var(--on-brand-soft);white-space:nowrap}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td .lvl{display:block;color:var(--muted)}
tfoot th,tfoot td{font-weight:600;background:var(--brand-soft);border-bottom:0}
.dot{display:inline-block;width:.75rem;height:.75rem;border-radius:2px;margin-right:.5rem;
  vertical-align:-.0625rem}
.legend{display:flex;flex-wrap:wrap;gap:.25rem 1rem;margin:.5rem 0 0;padding:0;list-style:none;
  font-size:.875rem;color:var(--muted)}
.legend li{display:flex;align-items:center;gap:.375rem}
.legend .sw{width:1rem;height:.75rem;border-radius:2px;display:inline-block}
.legend .lg-share{font-variant-numeric:tabular-nums;color:var(--ink)}
footer{max-width:86rem;margin:0 auto;padding:1rem 1.5rem 2rem;color:var(--muted);font-size:.875rem}
footer p{margin:.25rem 0}
@media (max-width:44rem){
  /* The drawing keeps a readable minimum and the figure scrolls sideways inside its own
     box: a phone may pan a picture, but the page never scrolls sideways. */
  .figure{padding:.5rem}
  th,td{padding:.4rem .5rem}
}
@media print{
  body{background:#fff}
  header{background:#fff;color:#000;border-bottom:2px solid #000}
  .figure{overflow:visible;border:0;padding:0}
  .figure svg{min-width:0}
  table{break-inside:auto}
  tr{break-inside:avoid}
  figure{break-inside:avoid}
  .cs-share{fill:#000}
}

  /* Dark. --brand-dark is the darkest surface in the dark theme and --on-brand resolves to
     --bg there, so the band that reads white-on-ocean in light would be dark on dark. The two
     categorical inks flip with the ramp: the strong bands are the light ones here. */
  @media screen and (prefers-color-scheme: dark){
    header{color:var(--ink)}
    :root{--s1:#d5ece9;--s2:#8fcfc6;--s3:#3f9a93;--s4:#276b74;--srest:#3b4d5c;
      --cs-ink-a:#0e1c2e;--cs-ink-b:#eef4f5}
  }
table{display:block;max-width:100%;overflow-x:auto}
</style>
</head>
<body>
<header><div class="in">
  <h1>{{TITLE}}</h1>
  <p class="sub">{{SUBTITLE}}</p>
</div></header>
<main>
  <figure class="figure">
{{SVG}}
    <figcaption>{{CAPTION}} {{T:caption_rounding}}</figcaption>
  </figure>
  <ul class="legend">{{LEGEND}}</ul>

  <h2 id="moves-h">{{T:head_moves}}</h2>
  <ul class="moves" aria-labelledby="moves-h">
{{MOVES}}
  </ul>
  <p class="note">{{REST_NOTE}}</p>

  <h2 id="tbl-h">{{T:head_table}}</h2>
  <table aria-labelledby="tbl-h">
    <caption>{{T:table_caption}}</caption>
    <thead><tr>
      <th scope="col">{{T:col_cat}}</th>
{{TABLE_HEAD}}
    </tr></thead>
    <tbody>
{{TABLE_ROWS}}
    </tbody>
    <tfoot>
{{TOTAL_ROW}}
    </tfoot>
  </table>
</main>
<footer>
  <p>{{T:footer_a}}</p>
  <p>{{T:footer_b}}</p>
  <p>{{SOURCE_LINE}} · {{T:footer_built}} {{BUILD_TIMESTAMP}}</p>
  <p>{{FEEDBACK_BLOCK}}</p>
</footer>
</body>
</html>
