<html lang="{{T:html_lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{TITLE}}</title>
<!--
  {{TITLE}}
  PROVENANCE  (do not delete - this is how output gets traced back)
    Source data : {{SOURCE_DESCRIPTION}}
    Extracted   : {{EXTRACT_TIMESTAMP}}
    Built       : {{BUILD_TIMESTAMP}}
    Requested by: {{REQUESTED_BY}}
    Made with   : Tún - tun.community
    Rows        : {{ROWS_INLINED}} rows on the timeline, {{TICKS_NOTE}}

  This is a self-contained artefact: no server, no CDN dependency, no licence required to
  view. It works offline, from a OneDrive/SharePoint-synced folder.

  What this file is: a timeline. One bar per row, positioned by its own start and end on a
  single time axis, so "when" and "what overlaps" are answered by looking rather than by
  comparing two date columns by hand.

  What it is NOT: a project plan. There are no dependencies, no critical path, no
  percentage complete and no resource levelling: those are claims about the future that this
  file cannot know, and a picture that implies them without holding them is worse than a
  table. It draws the dates it was given.

  There is no script in this file. A timeline is a picture; the numbers behind the picture
  are in the table below it, which is also what a screen reader and a printer read. A filter
  would have to re-lay the drawing, and a re-laid drawing is a second thing to get wrong.
-->
<style>
/* The colour tokens are inlined by the builder from tools/tokens/: one seam shared with
   every other artefact, which is also how this page follows the operating system's dark
   setting with no script. Add no hex of your own here. */
{{TOKEN_CSS}}
:root{
  /* The drawing's three roles, mapped onto the seam rather than onto recalled values. The
     dark block below re-points --bar: a bar fill chosen for a white panel is invisible on a
     dark one. --bar-done and --bar-late were declared here and painted nowhere (the builder
     emits one .tl-bar and no status class), so they are gone rather than themed. */
  --bar:var(--brand);
  --grid:var(--rule);
  /* The today rule and its 14 px label are TEXT as well as a line, so they take the
     text-safe negative, not --bad: Fire Red on the panel is 4.49:1, under AA. */
  --today:var(--bad-ink);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Eksempel AS","Segoe UI",system-ui,-apple-system,sans-serif;font-size:1rem;line-height:1.5}
header{background:var(--brand-dark);color:var(--on-brand);padding:1.25rem 1.5rem}
header .in{max-width:86rem;margin:0 auto}
h1{margin:0;font-size:1.375rem;line-height:1.75rem;font-weight:600}
header .sub{margin:.25rem 0 0;font-size:.875rem;line-height:1.5;opacity:.9}
main{max-width:86rem;margin:0 auto;padding:1.5rem}
h2{font-size:1.125rem;line-height:1.5rem;margin:2rem 0 .5rem;font-weight:600}
.figure{margin:0;background:var(--panel);border:1px solid var(--line);border-radius:.5rem;
  padding:1rem;overflow:auto}
/* Never narrower than 1 unit = 1 px: the drawing's text is 14 units, and a
   scaled-down drawing is text under the floor. Below that the box pans. */
.figure svg{display:block;width:100%;height:auto;min-width:62.5rem}
.tl-grid{stroke:var(--grid);stroke-width:1}
.tl-axis{stroke:var(--line);stroke-width:1}
.tl-tick{fill:var(--muted);font-size:14px}
.tl-task{fill:var(--ink);font-size:14px}
.tl-sub{fill:var(--muted);font-size:14px}
.tl-group{fill:var(--brand-dark);font-size:14px;font-weight:600}
.tl-bar{fill:var(--bar);rx:3}
.tl-band{fill:var(--brand-soft)}
.tl-today{stroke:var(--today);stroke-width:2;stroke-dasharray:4 3}
.tl-today-label{fill:var(--today);font-size:14px;font-weight:600}
.tl-days{fill:var(--muted);font-size:14px}
figcaption{margin:.75rem 0 0;font-size:.875rem;line-height:1.5;color:var(--muted)}
table{width:100%;border-collapse:collapse;background:var(--panel);
  border:1px solid var(--line);border-radius:.5rem;font-size:.875rem;line-height:1.5}
caption{text-align:left;padding:0 0 .5rem;color:var(--muted)}
th,td{padding:.5rem .75rem;text-align:left;border-bottom:1px solid var(--line);
  vertical-align:top}
thead th{background:var(--brand-soft);color:var(--on-brand-soft);white-space:nowrap}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tbody tr:last-child td{border-bottom:0}
.legend{display:flex;flex-wrap:wrap;gap:.25rem 1rem;margin:.5rem 0 0;padding:0;list-style:none;
  font-size:.875rem;color:var(--muted)}
.legend li{display:flex;align-items:center;gap:.375rem}
.legend .sw{width:1rem;height:.75rem;border-radius:2px;display:inline-block}
footer{max-width:86rem;margin:0 auto;padding:1rem 1.5rem 2rem;color:var(--muted);font-size:.875rem}
footer p{margin:.25rem 0}
@media (max-width:44rem){
  /* The drawing keeps a readable minimum and the figure scrolls sideways inside its own
     box: a phone may pan a picture, but the page never scrolls sideways. */
  .figure{padding:.5rem}
  th,td{padding:.4rem .5rem}
}
/* Dark, for a reader whose operating system asks for it and who has chosen no theme of
   their own. The declarations above come from theme-dark.css; what follows is what a
   drawing cannot inherit.

   1. THE BAR FILL. --bar is the palette's primary, which is chosen to sit on white and is
      1.43:1 against a dark panel: every row of the drawing would be blank. --palette-accent-
      light is the slot that exists for a mark on a dark surface, and it clears the 3:1
      non-text minimum in all three shipped palettes: 11.62:1 neutral, 13.87:1 brand,
      9.90:1 tun. The red "today" rule keeps its own slot and stays 58.4, 104.3 and 71.1
      deltaE away from it, so the two never read as one mark.
   2. THE GROUP HEADING is 14 px SVG text filled with --brand-dark, which in dark is again
      the darkest surface: the heading would disappear. --brand is the slot for a readable
      colour on a dark surface, 6.95:1 to 9.08:1 against the panel.
   3. THE HEADER BAND fills with --brand-dark and writes --on-brand on it: two darks in dark,
      1.39:1. It uses the pair the theme defines for a brand fill. */
@media screen and (prefers-color-scheme: dark){
  :root:not([data-theme]){--bar:var(--palette-accent-light)}
  :root:not([data-theme]) .tl-group{fill:var(--brand)}
  :root:not([data-theme]) header{background:var(--brand);color:var(--on-brand)}
}
@media print{
  body{background:#fff}
  header{background:#fff;color:#000;border-bottom:2px solid #000}
  .figure{overflow:visible;border:0;padding:0}
  .figure svg{min-width:0}
  table{break-inside:auto}
  tr{break-inside:avoid}
}
table{display:block;max-width:100%;overflow-x:auto}
</style>
</head>
<body>
<header><div class="in">
  <h1>{{TITLE}}</h1>
  <p class="sub">{{SUBTITLE}}</p>
</div></header>
<main>
  <figure class="figure">
{{SVG}}
    <figcaption>{{T:caption}}</figcaption>
  </figure>
  <ul class="legend">{{LEGEND}}</ul>

  <h2 id="tbl-h">{{T:head_table}}</h2>
  <table aria-labelledby="tbl-h">
    <caption>{{T:table_caption}}</caption>
    <thead><tr>
      <th scope="col">{{T:col_task}}</th>
      <th scope="col">{{T:col_start}}</th>
      <th scope="col">{{T:col_end}}</th>
      <th scope="col" class="num">{{T:col_days}}</th>
      <th scope="col">{{T:col_group}}</th>
      <th scope="col">{{T:col_owner}}</th>
      <th scope="col">{{T:col_status}}</th>
    </tr></thead>
    <tbody>
{{TABLE_ROWS}}
    </tbody>
  </table>
</main>
<footer>
  <p>{{T:footer_a}}</p>
  <p>{{T:footer_b}}</p>
  <p>{{SOURCE_LINE}} · {{T:footer_built}} {{BUILD_TIMESTAMP}}</p>
</footer>
</body>
</html>
