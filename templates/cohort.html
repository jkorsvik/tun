<html lang="{{T:html_lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{TITLE}}</title>
<!--
  {{TITLE}}
  PROVENANCE  (do not delete - this is how output gets traced back)
    Source data : {{SOURCE_DESCRIPTION}}
    Extracted   : {{EXTRACT_TIMESTAMP}}
    Built       : {{BUILD_TIMESTAMP}}
    Requested by: {{REQUESTED_BY}}
    Made with   : Tún - tun.community
    Cohorts     : {{COHORT_COUNT}} drawn, {{ENTITY_COUNT}} distinct {{ENTITY_WORD}}

  This is a self-contained artefact: no server, no CDN dependency, no licence required to
  view. It works offline, from a OneDrive/SharePoint-synced folder.

  What this file is: one row per cohort, one column per period since the cohort started,
  shaded by the share of that cohort still active, with the count and the share printed in
  the cell and the bands printed in the legend.

  What it is NOT: a claim about why people leave, and not a forecast. It counts the rows the
  extract holds. A blank in the lower right is "not yet observable", not zero.

  There is no script in this file. A filter would re-derive the cohorts, and the derivation
  is the claim being made.
-->
<style>
/* The colour tokens are inlined by the builder from tools/tokens/: one seam shared with
   every other artefact, which is also how this page follows the operating system's dark
   setting with no script. Add no hex of your own here. */
{{TOKEN_CSS}}
:root{
  /* The two stripes of the "not yet" texture. A texture is not a value, and the seam's
     --line nearly matches the panel, so a hatched cell built from it would read as an
     empty one. These are the only colours this template still declares. */
  --hatch-1:#f2f2f2;--hatch-2:#8f8f8f;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Eksempel AS","Segoe UI",system-ui,-apple-system,sans-serif;font-size:1rem;line-height:1.5}
header{background:var(--brand-dark);color:var(--on-brand);padding:1.25rem 1.5rem}
header .in{max-width:86rem;margin:0 auto}
h1{margin:0;font-size:1.375rem;line-height:1.75rem;font-weight:600}
header .sub{margin:.25rem 0 0;font-size:.875rem;line-height:1.5;opacity:.9}
main{max-width:86rem;margin:0 auto;padding:1.5rem}
h2{font-size:1.125rem;line-height:1.5rem;margin:2rem 0 .5rem;font-weight:600}
.figure{margin:0;background:var(--panel);border:1px solid var(--line);border-radius:.5rem;
  padding:1rem}
/* Only the table scrolls. The caption, the legend and the notes are prose and must wrap at the
   window's own width: inside the scroll box they take the table's width and are clipped mid-word
   on a phone, which reads as a broken page rather than a wide table. */
.scroll{overflow-x:auto}
.cap{margin:0 0 .75rem;color:var(--muted);font-size:.875rem;line-height:1.5}
.sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;
  clip:rect(0 0 0 0);white-space:nowrap;border:0}
.hint{display:none;margin:.5rem 0 0;color:var(--muted);font-size:.875rem;line-height:1.5}
@media (max-width:40rem){.hint{display:block}}
figcaption{margin:.75rem 0 0;font-size:.875rem;line-height:1.5;color:var(--muted)}
/* The grid is a table, not a drawing: it is a rectangle of numbers, so it gets real row
   and column headers and a screen reader can walk it. It never shrinks its text. */
table{width:100%;border-collapse:separate;border-spacing:2px;font-size:.875rem;line-height:1.5}
caption{text-align:left;padding:0 0 .75rem;color:var(--muted);caption-side:top}
th,td{padding:.5rem .625rem;text-align:right;font-variant-numeric:tabular-nums;
  white-space:nowrap}
thead th{background:var(--brand-soft);color:var(--on-brand-soft);font-weight:600;
  text-align:center}
thead th.row-h{text-align:left}
tbody th{background:var(--brand-soft);color:var(--on-brand-soft);text-align:left;font-weight:600}
tbody th .sz{display:block;font-weight:400;font-size:.875rem;color:var(--muted)}
/* A cell that cannot exist yet. Hatched, never a zero: "not yet" is not "none". */
td.future{background:repeating-linear-gradient(45deg,var(--hatch-1) 0 .1875rem,var(--hatch-2) .1875rem .375rem)}
td .pc{display:block;font-size:.875rem;font-weight:400;opacity:.9}
.legend{list-style:none;display:flex;flex-wrap:wrap;gap:.5rem 1.25rem;margin:1rem 0 0;
  padding:0}
.legend li{display:flex;align-items:center;gap:.5rem;font-size:.875rem;line-height:1.5}
.legend .sw{display:inline-block;width:1.5rem;height:1rem;border:1px solid var(--line);
  border-radius:.1875rem}
.legend .sw-future{background:repeating-linear-gradient(45deg,var(--hatch-1) 0 .1875rem,var(--hatch-2) .1875rem .375rem)}
.note{margin:1rem 0 0;padding:.75rem 1rem;background:var(--brand-soft);border-radius:.5rem;
  font-size:.9375rem;line-height:1.5}
.meta{margin:0;padding-left:1.25rem;font-size:.875rem;line-height:1.5;color:var(--muted)}
.meta li{margin:.25rem 0}
footer{max-width:86rem;margin:0 auto;padding:1rem 1.5rem 2rem;color:var(--muted);font-size:.875rem}
footer p{margin:.25rem 0}
@media print{
  body{background:#fff}
  header{background:#fff;color:#000;border-bottom:2px solid #000}
  .note{background:#fff;padding-left:0}
  .meta{color:#000}
  tr,figure{break-inside:avoid}
  thead{display:table-header-group}
}

  /* Dark. --brand-dark is the darkest surface in the dark theme, and --on-brand resolves to
     --bg there, so the band that reads white-on-ocean in light would be dark on dark. */
  @media screen and (prefers-color-scheme: dark){
    header{color:var(--ink)}
    :root{--hatch-1:#1d4a52;--hatch-2:#5f9aa8}
  }
</style>
</head>
<body>
<header><div class="in">
  <h1>{{TITLE}}</h1>
  <p class="sub">{{SUBTITLE}}</p>
</div></header>
<main>
  <figure class="figure">
  <p class="cap" aria-hidden="true">{{CAPTION}}</p>
  <div class="scroll">
  <table>
    <caption class="sr-only">{{CAPTION}}</caption>
    <thead><tr>
      <th scope="col" class="row-h">{{T:col_cohort}}</th>
{{TABLE_HEAD_COLS}}
    </tr></thead>
    <tbody>
{{TABLE_ROWS}}
    </tbody>
  </table>
  </div>
  <p class="hint">{{T:scroll_hint}}</p>
  </figure>

{{LEGEND}}

  <p class="note">{{NOTE_LEAD}}</p>

  <h2 id="how-h">{{T:head_notes}}</h2>
  <ul class="meta" aria-labelledby="how-h">
{{NOTE_LIST}}
  </ul>
</main>
<footer>
  <p>{{T:footer_a}}</p>
  <p>{{T:footer_b}}</p>
  <p>{{SOURCE_LINE}} · {{T:footer_built}} {{BUILD_TIMESTAMP}}</p>
  <p>{{FEEDBACK_BLOCK}}</p>
</footer>
</body>
</html>
