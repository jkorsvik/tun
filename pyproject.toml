[project]
name = "tun"
version = "0.1.0"
description = "Standalone interactive dashboards distributed as documents via SharePoint/OneDrive"
requires-python = ">=3.9"

# The Tier 1 path — build + publish a dashboard — needs NO dependencies at all.
# tools/ is stdlib-only Python on purpose, so nothing has to be installed to use it.
dependencies = []

[project.optional-dependencies]
# Only needed for `tun-verify` / setup.py, which open the finished dashboard in a
# real browser to prove it renders. Install with:  uv sync --extra verify
verify = ["playwright>=1.40"]

# Only needed for examples/15-chart-library-comparison-poc/'s Matplotlib-generated SVGs
# (build-time only — the shipped HTML never imports matplotlib, it only embeds the SVG
# text matplotlib already wrote to disk). Not a dependency of the Tier 1 path above.
# Install with:  uv sync --extra charts
charts = ["matplotlib>=3.8"]

# ---------------------------------------------------------------------------
# Package sources.  uv only — never pip.
#
# PyPI stays the default. Eksempel AS Nexus is declared as an EXTRA source: it is on the
# internal network and is faster and more reliable from a Eksempel AS laptop, and it is the
# route that works when public PyPI is blocked.
#
# Verified reachable from a managed Mac (HTTP 200, real package index):
#   https://packages.example.com.eksempel.no/nexus/repository/pypi-group/simple
#
# ⚠ Do NOT assume this works from CI. GitHub-hosted runners sit OUTSIDE the Eksempel AS
#   network and Nexus is behind Entra Application Proxy — it answers them with a
#   302 to login.microsoftonline.com, which package clients happily hash into a
#   bogus "checksum mismatch". Internal access from CI needs an in-VPC runner.
# ---------------------------------------------------------------------------
[[tool.uv.index]]
name = "eksempel-nexus"
url = "https://packages.example.com.eksempel.no/nexus/repository/pypi-group/simple"
